<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Piano Glass</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
        textarea,input{-webkit-user-select:text;user-select:text}
        html,body{height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial;touch-action:none}
        #app{display:flex;flex-direction:column;height:100dvh}
        #top{height:9%;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#1a1a1a;border-bottom:2px solid #444;gap:8px}
        #title{color:gold;font-weight:bold;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-size:15px}
        .tb{background:#444;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:22px;min-width:52px;text-align:center;transition:filter .1s}
        .tb:active{background:#666;filter:brightness(1.2)}
        #stage{flex:1;position:relative;background:#000;overflow:hidden;border-left:2px solid gold;border-right:2px solid gold;min-height:0}
        #cv{width:100%;height:100%;display:block}
        #hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none;font-weight:bold;z-index:2}
        #score{color:gold;font-size:24px;text-shadow:0 0 10px gold}
        #best{color:#888;font-size:13px;align-self:center}
        #combo{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:60px;font-weight:bold;color:gold;text-shadow:0 0 20px gold,0 0 40px #f80;pointer-events:none;opacity:0;transition:opacity .2s;z-index:3}
        #combo.show{opacity:1}
        #cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:5;font-size:100px;font-weight:bold;color:gold;text-shadow:0 0 30px gold}
        #sum{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.96);border:2px solid gold;border-radius:12px;padding:20px;z-index:8;display:none;text-align:center;min-width:280px;max-width:92%}
        #sum h2{color:gold;margin-bottom:12px}
        #sum .r{display:flex;justify-content:space-between;gap:20px;margin:6px 0;font-size:14px}
        #sum .r span:last-child{color:gold;font-weight:bold}
        #sum .btns{display:flex;gap:8px;margin-top:14px}
        #sum button{flex:1;padding:10px;background:gold;color:#000;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
        #sum button.sec{background:#444;color:#fff}
        #pad{height:30%;display:flex;border-top:2px solid #333;padding-bottom:env(safe-area-inset-bottom,0);gap:4px;padding-left:4px;padding-right:4px;padding-top:4px;background:#0a0a0a}
        .btn{flex:1;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;border:3px solid;touch-action:none;transition:transform .05s,filter .1s,box-shadow .1s;will-change:filter;border-radius:12px;background:#1a1a1a;position:relative;overflow:hidden;padding:6px 0}
        .btn.on{transform:scale(0.96);filter:brightness(1.5);box-shadow:0 0 24px currentColor}
        .btn svg{width:60%;height:60%;max-width:80px;max-height:80px}
        #b-t{border-color:#ff3060;color:#ff3060}
        #b-v{border-color:#00d0ff;color:#00d0ff}
        #b-m{border-color:#ffcc00;color:#ffcc00}
        #pop{display:none;position:absolute;top:8%;left:8%;width:84%;max-height:74%;background:rgba(0,0,0,.97);border:2px solid gold;border-radius:12px;z-index:10;flex-direction:column;padding:16px}
        #pop h3{color:gold;text-align:center;margin-bottom:12px;font-size:16px}
        #list{overflow-y:auto;max-height:320px}
        .item{padding:14px;margin:6px 0;background:#222;border:1px solid #555;border-radius:6px;display:flex;justify-content:space-between;cursor:pointer;font-size:14px}
        .item:active{background:#444}
        .item .bs{color:#ffcc00;font-size:12px}
        #pop #close{margin-top:12px;padding:12px;background:gold;color:#000;font-weight:bold;border:none;border-radius:6px;cursor:pointer;font-size:14px}
    </style>
</head>
<body>
    <div id="app">
        <div id="top">
            <div class="tb" id="openLib">📚</div>
            <div id="title">—</div>
            <div class="tb" id="explore">🔍</div>
        </div>
        <div id="stage">
            <canvas id="cv"></canvas>
            <div id="hud"><div id="score">0</div><div id="best"></div></div>
            <div id="combo"></div>
            <div id="cd"></div>
            <div id="sum">
                <h2>🎉 HOÀN THÀNH!</h2>
                <div class="r"><span>Điểm:</span><span id="s-score">0</span></div>
                <div class="r"><span>Hit/Miss:</span><span id="s-hm">0/0</span></div>
                <div class="r"><span>Combo max:</span><span id="s-combo">0</span></div>
                <div class="r"><span>🍷 Tròn:</span><span id="s-pt">0%</span></div>
                <div class="r"><span>🥃 Vuông:</span><span id="s-pv">0%</span></div>
                <div class="r"><span>🍷 Méo:</span><span id="s-pm">0%</span></div>
                <div class="r"><span>Kỷ lục:</span><span id="s-best">0</span></div>
                <div class="btns">
                    <button class="sec" id="save">📸</button>
                    <button id="cls">Đóng</button>
                </div>
            </div>
        </div>
        <div id="pad">
            <button class="btn" id="b-t" aria-label="Ly tròn">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs><clipPath id="cp-t"><path d="M30,25 Q30,70 50,85 Q70,70 70,25 Z"/></clipPath></defs>
                    <path d="M30,25 Q30,70 50,85 Q70,70 70,25 Z" fill="rgba(255,48,96,.15)" stroke="currentColor" stroke-width="3"/>
                    <rect class="liquid" x="20" y="85" width="60" height="0" fill="currentColor" opacity=".55" clip-path="url(#cp-t)" style="transition:y .15s,height .15s"/>
                    <line x1="30" y1="25" x2="70" y2="25" stroke="currentColor" stroke-width="3"/>
                </svg>
            </button>
            <button class="btn" id="b-v" aria-label="Ly vuông">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs><clipPath id="cp-v"><path d="M28,25 L72,25 L66,85 L34,85 Z"/></clipPath></defs>
                    <path d="M28,25 L72,25 L66,85 L34,85 Z" fill="rgba(0,208,255,.15)" stroke="currentColor" stroke-width="3"/>
                    <rect class="liquid" x="20" y="85" width="60" height="0" fill="currentColor" opacity=".55" clip-path="url(#cp-v)" style="transition:y .15s,height .15s"/>
                </svg>
            </button>
            <button class="btn" id="b-m" aria-label="Ly méo">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs><clipPath id="cp-m"><path d="M30,25 Q28,55 36,75 Q50,88 64,75 Q72,55 70,25 Z"/></clipPath></defs>
                    <path d="M30,25 Q28,55 36,75 Q50,88 64,75 Q72,55 70,25 Z" fill="rgba(255,204,0,.15)" stroke="currentColor" stroke-width="3"/>
                    <rect class="liquid" x="20" y="85" width="60" height="0" fill="currentColor" opacity=".55" clip-path="url(#cp-m)" style="transition:y .15s,height .15s"/>
                    <line x1="30" y1="25" x2="70" y2="25" stroke="currentColor" stroke-width="3"/>
                </svg>
            </button>
        </div>
    </div>
    <div id="pop"><h3>📚 THƯ VIỆN</h3><div id="list"></div><button id="close">Đóng</button></div>
    <audio id="music" preload="auto" style="display:none"></audio>
    
    <script>
    // ==========================================================
    // THAY ĐƯỜNG DẪN GITHUB RAW CỦA BẠN VÀO ĐÂY (Nhớ có dấu / ở cuối)
    // ==========================================================
    const GITHUB_RAW_BASE = "https://github.com/xuanhoai78hp-oss/tranh-ba-game/raw/refs/heads/main/2.txt";

    const FALL = 3.0;
    const CD_SEC = 3;
    const HIT_ZONE_TOP = 0.70;
    const HIT_ZONE_BOT = 0.82;
    const COL   = { t:'#ff3060', v:'#00d0ff', m:'#ffcc00' };
    const SHAPE = { t:'circle', v:'square', m:'diamond' };
    const BTN_ID= { t:'b-t', v:'b-v', m:'b-m' };
    const KEY   = 'piano_glass_v1';
    let scores = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch { return {} } })();
    const saveScores = () => { try { localStorage.setItem(KEY, JSON.stringify(scores)) } catch {} };
    const music = document.getElementById('music');
    let musicReady = false;
    let curFile = null;
    let notes = [];
    let startTs = 0;
    let phase = 'idle';
    let score = 0, combo = 0, maxCombo = 0, hitCount = 0, missCount = 0;
    let fillPercent = { t:0, v:0, m:0 };
    let totalMs   = { t:0, v:0, m:0 };
    let heldMs    = { t:0, v:0, m:0 };
    const holds = new Map();

    function clearSelection() { const sel = window.getSelection(); if (sel && sel.rangeCount > 0) sel.removeAllRanges(); }
    for (const el of [document.getElementById('pad'), document.getElementById('stage')]) {
        el.addEventListener('selectstart', e => e.preventDefault());
        el.addEventListener('contextmenu', e => e.preventDefault());
        el.addEventListener('dragstart',   e => e.preventDefault());
    }
    document.addEventListener('selectionchange', () => { if (phase === 'play') clearSelection(); });
    document.addEventListener('dblclick', e => { if (e.target.closest('#pad,#stage,#ctrl,#top')) e.preventDefault(); });

    function parseSong(text) {
        const lines = text.split(/\r?\n/);
        const title = (lines[0] || '').trim();
        const arr = [];
        for (let i = 1; i < lines.length; i++) {
            const toks = lines[i].trim().split(/\s+/).filter(Boolean);
            for (const tok of toks) {
                const m = tok.match(/^([tvm])(\d+);(\d+)$/i);
                if (!m) continue;
                const type = m[1].toLowerCase();
                const s = +m[2], e = +m[3];
                if (e <= s) continue;
                arr.push({ type, startMs: s, endMs: e, state:'wait', y:-100, tone:null, fade:1, caughtMs:0 });
            }
        }
        arr.sort((a,b) => a.startMs - b.startMs);
        return { title, notes: arr };
    }

    async function loadSong(file) {
        try {
            const r = await fetch(GITHUB_RAW_BASE + file);
            if (!r.ok) throw new Error('404');
            const text = await r.text();
            const parsed = parseSong(text);
            if (parsed.notes.length === 0) throw new Error('no notes');
            
            music.pause();
            music.currentTime = 0;
            music.removeAttribute('src');
            musicReady = false;
            const base = file.replace(/\.txt$/i, '');
            
            const tryLoad = (src) => new Promise(res => {
                music.src = src;
                music.load();
                const onOk = () => {
                    music.removeEventListener('error', onErr);
                    musicReady = true;
                    res(true);
                };
                const onErr = () => {
                    music.removeEventListener('canplaythrough', onOk);
                    res(false);
                };
                music.addEventListener('canplaythrough', onOk, { once: true });
                music.addEventListener('error', onErr, { once: true });
                setTimeout(() => res(musicReady), 2000);
            });

            const okM = await tryLoad(GITHUB_RAW_BASE + base + '.m4a');
            if (!okM) await tryLoad(GITHUB_RAW_BASE + base + '.mp3');

            document.getElementById('title').textContent = parsed.title;
            curFile = file;
            notes = parsed.notes;
            
            totalMs = { t:0, v:0, m:0 };
            heldMs  = { t:0, v:0, m:0 };
            for (const n of notes) totalMs[n.type] += (n.endMs - n.startMs);
            
            score = 0; combo = 0; maxCombo = 0; hitCount = 0; missCount = 0;
            fillPercent = { t:0, v:0, m:0 };
            uiScore(); uiBest(); updateGlassFill(); countdown();
        } catch (e) {
            console.warn('loadSong:', e);
            alert('Không load được ' + file + '\n' + e.message);
        }
    }

    function uiScore() { document.getElementById('score').textContent = score; }
    function uiBest() { const b = scores[curFile] || 0; document.getElementById('best').textContent = b ? ` 🏅 ${b}` : ''; }

    function countdown() {
        const el = document.getElementById('cd');
        el.style.display = 'flex';
        let s = CD_SEC;
        el.textContent = s;
        const timer = setInterval(() => {
            s--;
            if (s > 0) el.textContent = s;
            else {
                el.textContent = 'GO!';
                clearInterval(timer);
                setTimeout(() => { el.style.display = 'none'; startGame(); }, 500);
            }
        }, 700);
    }

    function startGame() {
        phase = 'play';
        for (const n of notes) {
            n.state = 'wait';
            n.y = -100;
            n.tone = null;
            n.fade = 1;
            n.caughtMs = 0;
        }
        heldMs = { t:0, v:0, m:0 };
        fillPercent = { t:0, v:0, m:0 };
        updateGlassFill();
        startTs = performance.now();
        if (musicReady) {
            music.currentTime = 0;
            music.play().catch(()=>{});
        }
    }

    function elapsedMs() {
        if (musicReady && !music.paused && !music.ended) return music.currentTime * 1000;
        return performance.now() - startTs;
    }

    function colAt(x, y) {
        const bt = document.getElementById('b-t').getBoundingClientRect();
        const bv = document.getElementById('b-v').getBoundingClientRect();
        const bm = document.getElementById('b-m').getBoundingClientRect();
        if (x>=bt.left&&x<=bt.right&&y>=bt.top&&y<=bt.bottom) return 't';
        if (x>=bv.left&&x<=bv.right&&y>=bv.top&&y<=bv.bottom) return 'v';
        if (x>=bm.left&&x<=bm.right&&y>=bm.top&&y<=bm.bottom) return 'm';
        return null;
    }

    function updateBtnVisual() {
        for (const t of ['t','v','m']) {
            let on = false;
            for (const p of holds.values()) if (p.col === t) { on = true; break; }
            document.getElementById(BTN_ID[t]).classList.toggle('on', on);
        }
    }

    function startHold(pid, col) {
        if (holds.has(pid)) {
            const old = holds.get(pid);
            if (old.col === col) return;
            endHold(pid);
        }
        holds.set(pid, { col, pressMs: elapsedMs() });
        updateBtnVisual();
    }

    function endHold(pid) {
        const p = holds.get(pid);
        if (!p) return;
        const relMs = elapsedMs();
        for (const n of notes) {
            if (n.type !== p.col || n.state !== 'active' || !n.tone) continue;
            const s = Math.max(p.pressMs, n.startMs);
            const e = Math.min(relMs, n.endMs);
            const dur = e - s;
            if (dur >= 10) {
                n.caughtMs = Math.min(n.endMs - n.startMs, (n.caughtMs||0) + dur);
                heldMs[n.type] += dur;
                const base = Math.floor(dur / 10);
                const mult = combo >= 20 ? 2.5 : combo >= 10 ? 2 : combo >= 5 ? 1.5 : 1;
                score += Math.round(base * mult);
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                hitCount++;
                uiScore();
                showCombo(combo);
            }
            n.tone = null;
            n.state = 'done';
        }
        holds.delete(pid);
        updateBtnVisual();
        updateGlassFill();
    }

    function showCombo(c) {
        const el = document.getElementById('combo');
        if (c >= 3) {
            el.textContent = `${c} COMBO`;
            el.classList.add('show');
            clearTimeout(el._t);
            el._t = setTimeout(() => el.classList.remove('show'), 700);
        } else {
            el.classList.remove('show');
        }
    }

    function updateGlassFill() {
        for (const t of ['t','v','m']) {
            const pct = totalMs[t] > 0 ? Math.min(100, (heldMs[t] / totalMs[t]) * 100) : 0;
            fillPercent[t] = pct;
            const btn = document.getElementById(BTN_ID[t]);
            const liquid = btn.querySelector('.liquid');
            if (liquid) {
                const h = (pct / 100) * 60;
                liquid.setAttribute('y', String(85 - h));
                liquid.setAttribute('height', String(h));
            }
        }
    }

    document.getElementById('pad').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        clearSelection();
        const c = colAt(e.clientX, e.clientY);
        if (c) startHold(e.pointerId, c);
    });
    document.addEventListener('pointermove', (e) => {
        if (!holds.has(e.pointerId)) return;
        e.preventDefault();
        const c = colAt(e.clientX, e.clientY);
        if (!c) return;
        const old = holds.get(e.pointerId);
        if (old.col !== c) {
            endHold(e.pointerId);
            startHold(e.pointerId, c);
        }
    }, { passive: false });
    document.addEventListener('pointerup',     (e) => { if (holds.has(e.pointerId)) endHold(e.pointerId); });
    document.addEventListener('pointercancel', (e) => { if (holds.has(e.pointerId)) endHold(e.pointerId); });

    const KEYMAP = { a:'t', s:'v', d:'m' };
    const KEYHELD = {};
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const k = e.key.toLowerCase();
        if (KEYMAP[k] && !KEYHELD[k]) {
            KEYHELD[k] = true;
            startHold('k_'+k, KEYMAP[k]);
        }
    });
    document.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (KEYMAP[k] && KEYHELD[k]) {
            KEYHELD[k] = false;
            endHold('k_'+k);
        }
    });

    document.getElementById('openLib').onclick = () => {
        const p = document.getElementById('pop');
        p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    };
    document.getElementById('close').onclick = () => document.getElementById('pop').style.display = 'none';
    document.getElementById('explore').onclick = () => { location.href = 'tuongzalo.html'; };
    document.getElementById('cls').onclick = () => document.getElementById('sum').style.display = 'none';
    document.addEventListener('visibilitychange', () => { if (document.hidden && musicReady && !music.paused) music.pause(); });

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        cv.width  = cv.parentElement.clientWidth  * dpr;
        cv.height = cv.parentElement.clientHeight * dpr;
        cv.logicalW = cv.parentElement.clientWidth;
        cv.logicalH = cv.parentElement.clientHeight;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 150));

    const sparks = [];
    function spawnSpark(x, y, color) {
        for (let i = 0; i < 5; i++) {
            const a = -Math.PI/2 + (Math.random()-0.5)*Math.PI*1.4;
            const sp = 1.5 + Math.random()*3;
            sparks.push({ x, y, vx: Math.cos(a)*sp + (Math.random()-0.5)*1.5, vy: Math.sin(a)*sp, life: 1, color: color || '#ffee88' });
        }
    }
    function rgba(hex, a) {
        const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
        return `rgba(${r},${g},${b},${a})`;
    }

    function drawGlass(x, yTop, yBot, shape, color, fillRatio, highlight) {
        const h = yBot - yTop;
        const w = h * 0.55;
        const xL = x - w/2, xR = x + w/2;
        ctx.save();
        ctx.strokeStyle = rgba(color, highlight ? 0.9 : 0.55);
        ctx.lineWidth = 3;
        ctx.shadowColor = color;
        ctx.shadowBlur = highlight ? 24 : 10;
        let path;
        if (shape === 'circle') {
            path = new Path2D();
            path.moveTo(xL, yTop);
            path.quadraticCurveTo(xL - 4, yTop + h*0.7, x, yBot);
            path.quadraticCurveTo(xR + 4, yTop + h*0.7, xR, yTop);
        } else if (shape === 'square') {
            path = new Path2D();
            path.moveTo(xL, yTop);
            path.lineTo(xL + w*0.08, yBot);
            path.lineTo(xR - w*0.08, yBot);
            path.lineTo(xR, yTop);
        } else {
            path = new Path2D();
            path.moveTo(xL, yTop);
            path.bezierCurveTo(xL + w*0.15, yTop + h*0.3, xL + w*0.15, yTop + h*0.6, x, yBot);
            path.bezierCurveTo(xR - w*0.15, yTop + h*0.6, xR - w*0.15, yTop + h*0.3, xR, yTop);
        }
        ctx.stroke(path);

        if (fillRatio > 0.01) {
            const waterTop = yBot - h * 0.85 * fillRatio;
            ctx.save();
            ctx.clip(path);
            const g = ctx.createLinearGradient(0, waterTop, 0, yBot);
            g.addColorStop(0, rgba(color, 0.85));
            g.addColorStop(1, rgba(color, 0.45));
            ctx.fillStyle = g;
            ctx.shadowBlur = 0;
            ctx.fillRect(xL - 10, waterTop, w + 20, yBot - waterTop + 5);

            ctx.strokeStyle = rgba('#ffffff', 0.5);
            ctx.lineWidth = 2;
            ctx.beginPath();
            const waveAmp = 2, waveLen = 14;
            for (let px = xL - 10; px <= xR + 10; px += 3) {
                const wy = waterTop + Math.sin((px + performance.now()*0.05) / waveLen) * waveAmp;
                if (px === xL - 10) ctx.moveTo(px, wy);
                else ctx.lineTo(px, wy);
            }
            ctx.stroke();
            ctx.restore();
        }
        ctx.beginPath();
        ctx.moveTo(xL, yTop);
        ctx.lineTo(xR, yTop);
        ctx.stroke();
        ctx.restore();
    }

    function drawHead(x, y, shape, color, alpha) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
        const h = 20, size = 40;
        if (shape === 'circle') {
            ctx.beginPath();
            ctx.arc(x, y, h, 0, Math.PI*2);
            ctx.fill();
        } else if (shape === 'square') {
            ctx.fillRect(x-h, y-h, size, size);
        } else {
            const w = size*0.95, hh = size*0.6;
            ctx.beginPath();
            ctx.moveTo(x, y-hh/2);
            ctx.lineTo(x+w/2, y);
            ctx.lineTo(x, y+hh/2);
            ctx.lineTo(x-w/2, y);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
    }

    function noteY(n, ms, H) {
        const hitLine = H * HIT_ZONE_TOP;
        const spawn = n.startMs - FALL*1000;
        if (ms < spawn) return -200;
        const t = (ms - spawn) / (FALL*1000);
        return -40 + (hitLine + 40) * t;
    }

    function loop() {
        const W = cv.logicalW, H = cv.logicalH;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        const colW = W/3;
        
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,.08)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(colW*i, 0);
            ctx.lineTo(colW*i, H);
            ctx.stroke();
        }
        ctx.restore();

        const hitTop = H * HIT_ZONE_TOP;
        const hitBot = H * HIT_ZONE_BOT;
        const glassYTop = hitTop + 6;
        const glassYBot = hitBot + (H * 0.12);

        const shapes = { t:'circle', v:'square', m:'diamond' };
        const cols   = { t:0, v:1, m:2 };
        for (const t of ['t','v','m']) {
            const cx = colW * cols[t] + colW/2;
            const holding = [...holds.values()].some(p => p.col === t);
            drawGlass(cx, glassYTop, glassYBot, shapes[t], COL[t], fillPercent[t]/100, holding || fillPercent[t] > 0);
        }

        ctx.save();
        ctx.strokeStyle = 'rgba(160,0,255,.5)';
        ctx.shadowColor = '#a0f';
        ctx.shadowBlur = 15;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(0, hitTop);
        ctx.lineTo(W, hitTop);
        ctx.stroke();
        ctx.restore();

        if (phase === 'play') {
            const ms = elapsedMs();
            for (const n of notes) {
                if (n.state === 'done') continue;
                const y = noteY(n, ms, H);
                n.y = y;
                const cx = colW * cols[n.type] + colW/2;
                const inGlass = (y >= glassYTop - 6) && (y <= glassYBot);

                if (!n.tone && n.state !== 'done' && n.state !== 'missed' && inGlass) {
                    let holding = false;
                    for (const p of holds.values()) if (p.col === n.type) { holding = true; break; }
                    if (holding) {
                        n.state = 'active';
                        n.tone = { start: performance.now() };
                    }
                }

                if (n.state === 'active' && ms >= n.endMs) {
                    for (const p of holds.values()) {
                        if (p.col !== n.type) continue;
                        const s = Math.max(p.pressMs, n.startMs);
                        const e = Math.min(ms, n.endMs);
                        const dur = e - s;
                        if (dur >= 10) {
                            n.caughtMs = Math.min(n.endMs - n.startMs, (n.caughtMs||0) + dur);
                            heldMs[n.type] += dur;
                            const base = Math.floor(dur/10);
                            const mult = combo >= 20 ? 2.5 : combo >= 10 ? 2 : combo >= 5 ? 1.5 : 1;
                            score += Math.round(base*mult);
                            combo++;
                            if (combo > maxCombo) maxCombo = combo;
                            hitCount++;
                            uiScore();
                            showCombo(combo);
                        }
                        break;
                    }
                    n.tone = null;
                    n.state = 'done';
                    updateGlassFill();
                    continue;
                }

                if (y > glassYBot + 40 && n.state === 'wait') {
                    n.state = 'missed';
                    n.fade = 1;
                    missCount++;
                    score = Math.max(0, score - 5);
                    combo = 0;
                    uiScore();
                    showCombo(0);
                }

                if (y > -300 && y < H + 200 && n.state !== 'done') {
                    let alpha = 1;
                    if (y > glassYBot) alpha = .4;
                    if (n.state !== 'missed') {
                        const tailLen = ((n.endMs - n.startMs) / 1000) * ((hitTop + 40) / FALL);
                        if (tailLen > 4) {
                            ctx.save();
                            const g = ctx.createLinearGradient(0, y, 0, y - tailLen);
                            g.addColorStop(0, rgba(COL[n.type], alpha));
                            g.addColorStop(1, rgba(COL[n.type], 0.2 * alpha));
                            ctx.fillStyle = g;
                            ctx.shadowColor = COL[n.type];
                            ctx.shadowBlur = 12;
                            const hw = 18;
                            ctx.fillRect(cx - hw, y - tailLen, hw*2, tailLen);
                            ctx.restore();
                        }
                    }

                    if (n.state === 'active' && n.tone) {
                        if (Math.random() < .7) spawnSpark(cx, y, COL[n.type]);
                        ctx.save();
                        ctx.globalAlpha = .3 + Math.random()*.3;
                        ctx.fillStyle = '#fff';
                        ctx.shadowColor = '#ffd';
                        ctx.shadowBlur = 30;
                        ctx.beginPath();
                        ctx.arc(cx, y, 25, 0, Math.PI*2);
                        ctx.fill();
                        ctx.restore();
                    }

                    drawHead(cx, y, shapes[n.type], COL[n.type], n.state === 'missed' ? n.fade * .4 : alpha);
                }
                if (n.state === 'missed') n.fade -= .02;
            }
            if (ms > (notes[notes.length-1]?.endMs || 0) + 3000) endGame();
        }

        for (let i = sparks.length-1; i >= 0; i--) {
            const p = sparks[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += .2;
            p.life -= .04;
            if (p.life <= 0) {
                sparks.splice(i,1);
                continue;
            }
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        }
        requestAnimationFrame(loop);
    }

    function endGame() {
        if (phase === 'done') return;
        phase = 'done';
        if (!music.paused) music.pause();
        holds.clear();
        updateBtnVisual();
        updateGlassFill();
        const old = scores[curFile] || 0;
        if (score > old) {
            scores[curFile] = score;
            saveScores();
        }
        const best = scores[curFile] || 0;
        uiBest();
        renderList();
        document.getElementById('s-score').textContent = score;
        document.getElementById('s-hm').textContent = `${hitCount}/${missCount}`;
        document.getElementById('s-combo').textContent = maxCombo;
        document.getElementById('s-pt').textContent = Math.round(fillPercent.t) + '%';
        document.getElementById('s-pv').textContent = Math.round(fillPercent.v) + '%';
        document.getElementById('s-pm').textContent = Math.round(fillPercent.m) + '%';
        document.getElementById('s-best').textContent = best;
        document.getElementById('sum').style.display = 'block';
    }

    document.getElementById('save').onclick = () => {
        const title = document.getElementById('title').textContent || 'Bài';
        const c = document.createElement('canvas');
        c.width = 600; c.height = 860;
        const x = c.getContext('2d');
        const g = x.createLinearGradient(0,0,0,860);
        g.addColorStop(0,'#1a0033');
        g.addColorStop(.5,'#330066');
        g.addColorStop(1,'#000');
        x.fillStyle = g;
        x.fillRect(0,0,600,860);
        x.strokeStyle = 'gold';
        x.lineWidth = 6;
        x.strokeRect(20,20,560,820);
        x.fillStyle = 'gold';
        x.textAlign = 'center';
        x.font = 'bold 48px Arial';
        x.fillText('🍷 KẾT QUẢ', 300, 100);
        x.fillStyle = '#fff';
        x.font = 'bold 28px Arial';
        x.fillText(title, 300, 170);
        x.fillStyle = 'gold';
        x.font = 'bold 110px Arial';
        x.shadowColor = 'gold';
        x.shadowBlur = 30;
        x.fillText(score, 300, 330);
        x.shadowBlur = 0;
        x.fillStyle = '#aaa';
        x.font = '24px Arial';
        x.fillText('ĐIỂM', 300, 370);
        x.fillStyle = '#fff';
        x.font = '26px Arial';
        x.textAlign = 'left';
        x.fillText('Hit: ' + hitCount, 100, 450);
        x.fillText('Miss: ' + missCount, 100, 495);
        x.fillText('Combo max: ' + maxCombo, 100, 540);
        x.fillStyle = '#ff3060';
        x.fillText('🍷 Tròn: ' + Math.round(fillPercent.t) + '%', 100, 600);
        x.fillStyle = '#00d0ff';
        x.fillText('🥃 Vuông: ' + Math.round(fillPercent.v) + '%', 100, 645);
        x.fillStyle = '#ffcc00';
        x.fillText('🍷 Méo: ' + Math.round(fillPercent.m) + '%', 100, 690);
        x.fillStyle = '#fff';
        x.fillText('Kỷ lục: ' + (scores[curFile] || 0), 100, 740);
        x.fillStyle = '#888';
        x.font = '20px Arial';
        x.textAlign = 'center';
        x.fillText(new Date().toLocaleString('vi-VN'), 300, 790);
        x.fillStyle = 'gold';
        x.font = 'bold 18px Arial';
        x.fillText('Piano Glass', 300, 820);
        const l = document.createElement('a');
        l.download = `ky-luc-${Date.now()}.png`;
        l.href = c.toDataURL('image/png');
        l.click();
    };

    const TOTAL = 20;
    const list = Array.from({ length: TOTAL }, (_, i) => ({ file: `${i+1}.txt`, label: `${i+1}` }));

    async function preload() {
        for (const s of list) {
            try {
                const r = await fetch(GITHUB_RAW_BASE + s.file);
                if (r.ok) {
                    const t = await r.text();
                    const f = t.split(/\r?\n/)[0].trim();
                    if (f) s.label = f;
                }
            } catch {}
        }
        renderList();
    }

    function renderList() {
        const el = document.getElementById('list');
        el.innerHTML = '';
        for (const s of list) {
            const d = document.createElement('div');
            d.className = 'item';
            const b = scores[s.file] || 0;
            d.innerHTML = `<span>${s.label}</span><span class="bs">${b ? ' 🏅 ' + b : ''}</span>`;
            d.onclick = () => loadSong(s.file);
            el.appendChild(d);
        }
    }

    renderList();
    preload();
    updateGlassFill();
    loop();
    </script>
</body>
