<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game 3D - Chiêu Thức Quả Cầu Sét & Hiệu Ứng Điện Giật</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0f19; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

        /* HUD thông số */
        #hud {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(15, 23, 42, 0.85); padding: 12px 18px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2); font-size: 13px; z-index: 10; line-height: 1.6;
        }
        #hud b { color: #38bdf8; }

        /* Thanh máu */
        .hp-bar-container {
            width: 150px; height: 10px; background: #334155; border-radius: 5px;
            overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 5px;
        }
        #hp-bar-fill { width: 100%; height: 100%; background: #22c55e; transition: width 0.2s; }

        /* Thông báo qua cửa */
        #portal-msg {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(56, 189, 248, 0.95); color: #000; padding: 12px 24px;
            border-radius: 20px; font-weight: bold; font-size: 15px; display: none;
            z-index: 20; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center;
        }

        /* Joystick ảo */
        .joystick-base {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            touch-action: none; z-index: 10;
        }
        .joystick-thumb {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px; background: rgba(56, 189, 248, 0.8);
            border-radius: 50%; pointer-events: none; transition: transform 0.05s linear;
        }

        /* Nút Tấn công Sét */
        .action-btn {
            position: absolute; bottom: 50px; right: 50px;
            width: 85px; height: 85px; background: linear-gradient(135deg, #0284c7, #38bdf8);
            border: 3px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
            color: #fff; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            touch-action: none; z-index: 10; cursor: pointer; text-align: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.8); animation: glow 1s infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 10px rgba(56, 189, 248, 0.6); }
            to { box-shadow: 0 0 25px rgba(250, 204, 21, 0.9); }
        }
        .action-btn:active { transform: scale(0.92); }
    </style>
    <!-- Thư viện Three.js CDN chuẩn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="portal-msg">⚡ ĐẠT ĐỦ MÁU & CÔNG LỰC! MỞ CỔNG VỀ THÔN TÂN THỦ... ⚡</div>

    <div id="hud">
        ⚡ <b>QUẢ CẦU SÉT - SĂN CÔN TRÙNG</b><br>
        ❤️ Máu: <span id="hp-val">100</span>% 
        <div class="hp-bar-container"><div id="hp-bar-fill"></div></div><br>
        ⚡ Công lực (Điểm): <span id="score-val">0</span> / 9<br>
        - Dùng chiêu Sét tiêu diệt quái, nhặt vật phẩm để qua cửa!
    </div>

    <div class="joystick-base" id="joystick">
        <div class="joystick-thumb" id="joystick-thumb"></div>
    </div>
    
    <div class="action-btn" id="btn-attack">QUẢ SÉT</div>

    <div id="canvas-container"></div>

    <!-- Âm thanh nền ngẫu nhiên từ 1 đến 9.mp3 -->
    <audio id="bg-audio" loop></audio>

    <script>
        // 1. KÍCH HOẠT ÂM THANH NỀN NGẪU NHIÊN 1-9.MP3
        const audioElem = document.getElementById('bg-audio');
        const randomTrack = Math.floor(Math.random() * 9) + 1;
        audioElem.src = `${randomTrack}.mp3`;
        
        function playAudio() {
            audioElem.play().catch(() => {});
        }
        window.addEventListener('pointerdown', playAudio, { once: true });
        window.addEventListener('keydown', playAudio, { once: true });

        // Hàm cắt sprite pixel chuẩn từ ảnh gốc
        function createSpriteTextureFromPixel(img, x, y, width, height) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(img, x, y, width, height, 0, 0, width, height);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        // 2. SCENE, CAMERA, RENDERER
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xe0f2fe, 1.2);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Mặt đất & Lưới
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(300, 60, 0x38bdf8, 0x334155);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // 3. TẠO CỔNG QUA MẢN (PORTAL VỀ THÔN TÂN THỦ) ở tọa độ (0, 0, -40)
        const portalGeo = new THREE.CylinderGeometry(3, 3, 0.2, 32);
        const portalMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
        const portalMesh = new THREE.Mesh(portalGeo, portalMat);
        portalMesh.position.set(0, 0.1, -40);
        scene.add(portalMesh);

        const portalLight = new THREE.PointLight(0x38bdf8, 3, 12);
        portalLight.position.set(0, 2, -40);
        scene.add(portalLight);

        // 4. TẠO BÃI CONTAINER (Ô 200x100px từ gapcont.png) & HỆ THỐNG VA CHẠM
        const CONT_W = 2.4, CONT_H = 3.2, CONT_L = 12.2;
        const boxGeometry = new THREE.BoxGeometry(CONT_W, CONT_H, CONT_L);
        const containerBoxes = [];

        const imgCont = new Image();
        imgCont.crossOrigin = "anonymous";
        imgCont.src = 'https://tranh-ba-game-gw3q.vercel.app/gapcont.png';

        let contMaterials = [];
        imgCont.onload = () => {
            for(let i=0; i<5; i++) {
                const tex = createSpriteTextureFromPixel(imgCont, i * 200, 0, 200, 100);
                contMaterials.push(new THREE.MeshStandardMaterial({ map: tex, roughness: 0.4 }));
            }
            buildContainerYard();
        };

        for(let i=0; i<5; i++) {
            contMaterials.push(new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.4 }));
        }

        function buildContainerYard() {
            const NUM_CLUSTERS_X = 4;
            const NUM_CLUSTERS_Z = 4;
            const ROAD_WIDTH = 18;

            for (let cx = 0; cx < NUM_CLUSTERS_X; cx++) {
                for (let cz = 0; cz < NUM_CLUSTERS_Z; cz++) {
                    const clusterX = (cx - NUM_CLUSTERS_X / 2) * (3 * CONT_W + ROAD_WIDTH);
                    const clusterZ = (cz - NUM_CLUSTERS_Z / 2) * (CONT_L + ROAD_WIDTH);

                    if (Math.abs(clusterX) < 10 && Math.abs(clusterZ + 40) < 10) continue;

                    containerBoxes.push({
                        minX: clusterX - 0.5, maxX: clusterX + 2 * CONT_W + 0.5,
                        minZ: clusterZ - CONT_L / 2 - 0.5, maxZ: clusterZ + CONT_L / 2 + 0.5
                    });

                    for (let r = 0; r < 2; r++) {
                        for (let h = 0; h < 2; h++) {
                            const matIndex = Math.floor(Math.random() * contMaterials.length);
                            const mesh = new THREE.Mesh(boxGeometry, contMaterials[matIndex]);
                            mesh.position.set(clusterX + r * CONT_W, h * CONT_H + CONT_H / 2, clusterZ);
                            mesh.castShadow = true; mesh.receiveShadow = true;
                            scene.add(mesh);
                        }
                    }
                }
            }
        }
        buildContainerYard();

        function isValidPosition(x, z) {
            for (let box of containerBoxes) {
                if (x >= box.minX && x <= box.maxX && z >= box.minZ && z <= box.maxZ) return false;
            }
            return true;
        }

        // 5. NHÂN VẬT & CÔN TRÙNG TỪ anh.png
        let gameState = { posX: 0, posZ: 20, angle: 0, hp: 100, score: 0, isTransitioning: false };

        const charGeo = new THREE.PlaneGeometry(2, 2);
        const charMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true });
        const characterMesh = new THREE.Mesh(charGeo, charMat);
        characterMesh.position.set(gameState.posX, 1, gameState.posZ);
        scene.add(characterMesh);

        let walkFrames = [], attackFrames = [];
        let enemyFrames1 = [], enemyFrames2 = [], enemyHitFrames1 = [], enemyHitFrames2 = [];
        const imgChar = new Image();
        imgChar.crossOrigin = "anonymous";
        imgChar.src = 'https://tranh-ba-game-gw3q.vercel.app/anh.png';
        imgChar.onload = () => {
            walkFrames = [
                createSpriteTextureFromPixel(imgChar, 0, 0, 40, 40),
                createSpriteTextureFromPixel(imgChar, 40, 0, 40, 40),
                createSpriteTextureFromPixel(imgChar, 80, 0, 40, 40),
                createSpriteTextureFromPixel(imgChar, 120, 0, 40, 40)
            ];
            attackFrames = [
                createSpriteTextureFromPixel(imgChar, 160, 0, 40, 40),
                createSpriteTextureFromPixel(imgChar, 200, 0, 40, 40),
                createSpriteTextureFromPixel(imgChar, 240, 0, 40, 40),
                createSpriteTextureFromPixel(imgChar, 280, 0, 40, 40)
            ];
            charMat.map = walkFrames[0];

            enemyFrames1 = [
                createSpriteTextureFromPixel(imgChar, 0, 40, 40, 40),
                createSpriteTextureFromPixel(imgChar, 40, 40, 40, 40),
                createSpriteTextureFromPixel(imgChar, 80, 40, 40, 40),
                createSpriteTextureFromPixel(imgChar, 120, 40, 40, 40)
            ];
            enemyHitFrames1 = [
                createSpriteTextureFromPixel(imgChar, 160, 40, 40, 40),
                createSpriteTextureFromPixel(imgChar, 200, 40, 40, 40),
                createSpriteTextureFromPixel(imgChar, 240, 40, 40, 40),
                createSpriteTextureFromPixel(imgChar, 280, 40, 40, 40)
            ];

            enemyFrames2 = [
                createSpriteTextureFromPixel(imgChar, 0, 80, 40, 40),
                createSpriteTextureFromPixel(imgChar, 40, 80, 40, 40),
                createSpriteTextureFromPixel(imgChar, 80, 80, 40, 40),
                createSpriteTextureFromPixel(imgChar, 120, 80, 40, 40)
            ];
            enemyHitFrames2 = [
                createSpriteTextureFromPixel(imgChar, 160, 80, 40, 40),
                createSpriteTextureFromPixel(imgChar, 200, 80, 40, 40),
                createSpriteTextureFromPixel(imgChar, 240, 80, 40, 40),
                createSpriteTextureFromPixel(imgChar, 280, 80, 40, 40)
            ];

            spawnEnemies();
        };

        const enemies = [];
        const items = [];

        function spawnEnemies() {
            for (let i = 0; i < 12; i++) {
                const enemyMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true });
                const enemyMesh = new THREE.Mesh(charGeo, enemyMat);
                
                const type = Math.random() > 0.5 ? 1 : 2;
                const frames = type === 1 ? enemyFrames1 : enemyFrames2;
                enemyMat.map = frames[0];

                let ex, ez, valid = false;
                while (!valid) {
                    ex = (Math.random() - 0.5) * 80;
                    ez = (Math.random() - 0.5) * 80;
                    valid = isValidPosition(ex, ez) && Math.abs(ez + 40) > 5;
                }

                enemyMesh.position.set(ex, 1, ez);
                scene.add(enemyMesh);
                enemies.push({ 
                    mesh: enemyMesh, 
                    type: type, 
                    frames: frames, 
                    hitFrames: type === 1 ? enemyHitFrames1 : enemyHitFrames2,
                    frameIndex: 0, 
                    timer: 0, 
                    alive: true, 
                    hitCount: 0, 
                    speed: type === 1 ? 1.5 : 1.1 
                });
            }
        }

        // 6. HỆ THỐNG TẠO QUẢ CẦU SÉT & HIỆU ỨNG TIA SÉT ZIGZAG (BALL LIGHTNING)
        const lightningBalls = [];

        function createLightningBall() {
            const ballGroup = new THREE.Group();

            // Lớp lõi trắng sáng chói (White core)
            const coreGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            ballGroup.add(coreMesh);

            // Lớp cầu sét bên trong (Inner Glow)
            const innerGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const innerMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 });
            ballGroup.add(new THREE.Mesh(innerGeo, innerMat));

            // Lớp hào quang rộng bên ngoài (Outer Glow)
            const outerGeo = new THREE.SphereGeometry(1.0, 16, 16);
            const outerMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
            ballGroup.add(new THREE.Mesh(outerGeo, outerMat));

            // Tạo các tia sét Zigzag gãy khúc quấn quanh quả cầu
            const lightningLines = [];
            for (let i = 0; i < 4; i++) {
                const points = [];
                let curr = new THREE.Vector3(0, 0, 0);
                points.push(curr.clone());
                for (let p = 0; p < 4; p++) {
                    curr.add(new THREE.Vector3((Math.random() - 0.5) * 1.2, (Math.random() - 0.5) * 1.2, (Math.random() - 0.5) * 1.2));
                    points.push(curr.clone());
                }
                const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                const lineMat = new THREE.LineBasicMaterial({ color: 0xe0f2fe, linewidth: 2 });
                const line = new THREE.Line(lineGeo, lineMat);
                ballGroup.add(line);
                lightningLines.push(line);
            }

            ballGroup.position.copy(characterMesh.position);
            scene.add(ballGroup);

            const dirX = Math.sin(gameState.angle);
            const dirZ = Math.cos(gameState.angle);

            lightningBalls.push({
                group: ballGroup,
                lines: lightningLines,
                dirX: dirX,
                dirZ: dirZ,
                speed: 18.0,
                life: 1.5
            });

            // Hiệu ứng chớp màn hình (Flicker / Flash) nhẹ khi tung chiêu
            renderer.domElement.style.filter = "brightness(1.5)";
            setTimeout(() => { renderer.domElement.style.filter = "brightness(1)"; }, 100);
        }

        // 7. ĐIỀU KHIỂN & NÚT CHIÊU SÉT
        const keys = { w: false, s: false, a: false, d: false };
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = true;
            if (e.key === 's' || e.key === 'S') keys.s = true;
            if (e.key === 'a' || e.key === 'A') keys.a = true;
            if (e.key === 'd' || e.key === 'D') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W') keys.w = false;
            if (e.key === 's' || e.key === 'S') keys.s = false;
            if (e.key === 'a' || e.key === 'A') keys.a = false;
            if (e.key === 'd' || e.key === 'D') keys.d = false;
        });

        let joystickInput = { forward: 0, turn: 0 };
        const joystick = document.getElementById('joystick');
        const thumb = document.getElementById('joystick-thumb');
        let joystickActive = false, touchId = null;

        joystick.addEventListener('pointerdown', (e) => {
            joystickActive = true; touchId = e.pointerId; joystick.setPointerCapture(touchId);
        });
        joystick.addEventListener('pointermove', (e) => {
            if (!joystickActive || e.pointerId !== touchId) return;
            const rect = joystick.getBoundingClientRect();
            let dx = e.clientX - (rect.left + rect.width / 2);
            let dy = e.clientY - (rect.top + rect.height / 2);
            const dist = Math.sqrt(dx*dx + dy*dy), maxDist = 40;
            if (dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
            thumb.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickInput.forward = -dy / maxDist; joystickInput.turn = dx / maxDist;
        });
        function resetJoystick() {
            joystickActive = false; thumb.style.transform = `translate(0px, 0px)`;
            joystickInput.forward = 0; joystickInput.turn = 0;
        }
        joystick.addEventListener('pointerup', resetJoystick);
        joystick.addEventListener('pointercancel', resetJoystick);

        let isAttacking = false;
        document.getElementById('btn-attack').addEventListener('click', () => {
            if (isAttacking) return;
            isAttacking = true;
            createLightningBall();

            let attIndex = 0;
            const attInterval = setInterval(() => {
                if (attIndex < attackFrames.length && attackFrames.length > 0) {
                    charMat.map = attackFrames[attIndex];
                    charMat.needsUpdate = true;
                    attIndex++;
                } else {
                    clearInterval(attInterval);
                    isAttacking = false;
                }
            }, 80);
        });

        // 8. VÒNG LẶP GAME & HIỆU ỨNG FLICKER, GIẬT ĐIỆN, KHÓI QUÁI
        let lastTime = 0, animTimer = 0, frameIndex = 0;

        function animate(time) {
            requestAnimationFrame(animate);
            const delta = (time - lastTime) / 1000;
            lastTime = time;

            if (gameState.isTransitioning) return;

            let moveVal = (keys.w ? 1 : 0) - (keys.s ? 1 : 0) + joystickInput.forward;
            moveVal = Math.max(-1, Math.min(1, moveVal));
            let turnVal = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + joystickInput.turn;
            turnVal = Math.max(-1, Math.min(1, turnVal));

            gameState.angle -= turnVal * 3.0 * delta;
            const moveSpeed = 6.0;
            const nextX = gameState.posX + Math.sin(gameState.angle) * moveVal * moveSpeed * delta;
            const nextZ = gameState.posZ + Math.cos(gameState.angle) * moveVal * moveSpeed * delta;

            if (isValidPosition(nextX, nextZ)) {
                gameState.posX = nextX;
                gameState.posZ = nextZ;
            }
            characterMesh.position.set(gameState.posX, 1, gameState.posZ);

            // Kiểm tra cổng qua màn (0, -40)
            const distToPortal = characterMesh.position.distanceTo(portalMesh.position);
            if (distToPortal < 3) {
                if (gameState.hp >= 90 && gameState.score >= 9) {
                    gameState.isTransitioning = true;
                    document.getElementById('portal-msg').style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'rungcontrung2.html';
                    }, 1500);
                } else {
                    document.getElementById('portal-msg').innerText = "⚠️ CẦN ĐẠT ≥ 90% MÁU & ≥ 9 ĐIỂM CÔNG LỰC ĐỂ VỀ THÔN!";
                    document.getElementById('portal-msg').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('portal-msg').style.display = 'none';
                        document.getElementById('portal-msg').innerText = "⚡ ĐẠT ĐỦ MÁU & CÔNG LỰC! ĐANG TIẾN VÀO CỔNG VỀ THÔN TÂN THỦ... ⚡";
                    }, 2000);
                }
            }

            if (!isAttacking && Math.abs(moveVal) > 0.1 && walkFrames.length > 0) {
                animTimer += delta;
                if (animTimer > 0.12) {
                    animTimer = 0;
                    frameIndex = (frameIndex + 1) % walkFrames.length;
                    charMat.map = walkFrames[frameIndex];
                    charMat.needsUpdate = true;
                }
            }

            // Cập nhật Quả Cầu Sét bay và hiệu ứng Flicker (đổi dáng tia sét liên tục mỗi frame)
            for (let i = lightningBalls.length - 1; i >= 0; i--) {
                const lb = lightningBalls[i];
                lb.life -= delta;
                lb.group.position.x += lb.dirX * lb.speed * delta;
                lb.group.position.z += lb.dirZ * lb.speed * delta;

                // Hiệu ứng Flicker: Đổi hình dáng tia sét ngẫu nhiên mỗi vài frame cho có lực
                lb.lines.forEach(line => {
                    const positions = line.geometry.attributes.position.array;
                    for (let p = 3; p < positions.length; p += 3) {
                        positions[p] += (Math.random() - 0.5) * 0.4;
                        positions[p+1] += (Math.random() - 0.5) * 0.4;
                        positions[p+2] += (Math.random() - 0.5) * 0.4;
                    }
                    line.geometry.attributes.position.needsUpdate = true;
                });

                // Va chạm với côn trùng
                for (let j = 0; j < enemies.length; j++) {
                    const enemy = enemies[j];
                    if (!enemy.alive) continue;

                    const dist = lb.group.position.distanceTo(enemy.mesh.position);
                    if (dist < 2.0) {
                        scene.remove(lb.group);
                        lightningBalls.splice(i, 1);

                        enemy.hitCount++;
                        enemy.mesh.material.map = enemy.hitFrames[Math.min(enemy.hitCount - 1, 3)];
                        enemy.mesh.material.needsUpdate = true;

                        // Khi quái hết máu (đủ 5 chiêu): Giật điện, cháy đen và bốc khói
                        if (enemy.hitCount >= 5) {
                            enemy.alive = false;
                            enemy.mesh.material.color.set(0x111111); // Cháy đen
                            
                            // Hiệu ứng khói/giật điện rồi biến mất sau 0.4s
                            setTimeout(() => {
                                scene.remove(enemy.mesh);
                            }, 400);

                            gameState.score += 1;
                            document.getElementById('score-val').innerText = gameState.score;
                            spawnDropItem(enemy.mesh.position.x, enemy.mesh.position.z);
                        }
                        break;
                    }
                }

                if (lb.life <= 0) {
                    scene.remove(lb.group);
                    lightningBalls.splice(i, 1);
                }
            }

            // AI Côn trùng đuổi theo
            enemies.forEach(enemy => {
                if (!enemy.alive) return;
                const dirX = gameState.posX - enemy.mesh.position.x;
                const dirZ = gameState.posZ - enemy.mesh.position.z;
                const dist = Math.sqrt(dirX*dirX + dirZ*dirZ);

                if (dist > 1.2) {
                    const step = enemy.speed * delta;
                    const nex = enemy.mesh.position.x + (dirX / dist) * step;
                    const nez = enemy.mesh.position.z + (dirZ / dist) * step;
                    if (isValidPosition(nex, nez)) enemy.mesh.position.set(nex, 1, nez);
                } else {
                    gameState.hp = Math.max(0, gameState.hp - 2.5 * delta);
                    document.getElementById('hp-val').innerText = Math.floor(gameState.hp);
                    document.getElementById('hp-bar-fill').style.width = gameState.hp + '%';
                }

                if (enemy.hitCount === 0) {
                    enemy.timer += delta;
                    if (enemy.timer > 0.15) {
                        enemy.timer = 0;
                        enemy.frameIndex = (enemy.frameIndex + 1) % enemy.frames.length;
                        enemy.mesh.material.map = enemy.frames[enemy.frameIndex];
                        enemy.mesh.material.needsUpdate = true;
                    }
                }
                enemy.mesh.quaternion.copy(camera.quaternion);
            });

            // Nhặt vật phẩm
            items.forEach((item, idx) => {
                if (!item.active) return;
                const dist = characterMesh.position.distanceTo(item.mesh.position);
                if (dist < 2.0) {
                    item.active = false;
                    scene.remove(item.mesh);
                    if (item.type === 'hp') {
                        gameState.hp = Math.min(100, gameState.hp + 15);
                        document.getElementById('hp-val').innerText = Math.floor(gameState.hp);
                        document.getElementById('hp-bar-fill').style.width = gameState.hp + '%';
                    } else {
                        gameState.score += 2;
                        document.getElementById('score-val').innerText = gameState.score;
                    }
                }
            });

            const camDist = 9, camHeight = 4.5;
            camera.position.x += (gameState.posX - Math.sin(gameState.angle) * camDist - camera.position.x) * 0.1;
            camera.position.z += (gameState.posZ - Math.cos(gameState.angle) * camDist - camera.position.z) * 0.1;
            camera.position.y = camHeight;
            camera.lookAt(gameState.posX, 1, gameState.posZ);

            characterMesh.quaternion.copy(camera.quaternion);
            renderer.render(scene, camera);
        }
        requestAnimationFrame(animate);

        function spawnDropItem(x, z) {
            const isHp = Math.random() > 0.5;
            const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const mat = new THREE.MeshBasicMaterial({ color: isHp ? 0x22c55e : 0xa855f7 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.5, z);
            scene.add(mesh);
            items.push({ mesh: mesh, type: isHp ? 'hp' : 'power', active: true });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
