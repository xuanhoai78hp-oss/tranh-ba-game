<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Fighter Jet - UFO Hunter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Virtual Controls Overlay */
        .touch-control {
            position: absolute;
            z-index: 10;
            touch-action: none;
        }

        /* Joystick Base */
        #joystick-base {
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(0, 255, 204, 0.15);
            border: 2px solid rgba(0, 255, 204, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-stick {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, rgba(0,255,204,0.9) 0%, rgba(0,150,120,0.7) 100%);
            border: 2px solid #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.7);
            transform: translate(0, 0);
            pointer-events: none;
        }

        /* Action Buttons */
        .btn-action {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            text-shadow: 0 0 5px #000;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.6);
        }
        .btn-action:active, .btn-action.active {
            transform: scale(0.92);
            filter: brightness(1.2);
        }
        #btn-fire {
            bottom: 35px;
            right: 30px;
            background: radial-gradient(circle, rgba(255,50,50,0.85) 0%, rgba(150,0,0,0.85) 100%);
            border-color: #ff3333;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
        }
        #btn-boost {
            bottom: 125px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(255,200,0,0.85) 0%, rgba(180,100,0,0.85) 100%);
            border-color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.6);
            font-size: 11px;
        }

        /* Nút Khám phá ở góc trên bên trái */
        #explore-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 20;
            background: rgba(10, 10, 30, 0.85);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #explore-btn:active {
            background: rgba(0, 255, 204, 0.2);
        }

        #sound-notice {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            background: rgba(0,0,0,0.85);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 16px 24px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas Screen -->
        <canvas id="gameCanvas"></canvas>

        <div id="sound-notice">CHẠM MÀN HÌNH ĐỂ BẬT ÂM THANH</div>

        <!-- Nút Khám phá dẫn tới trang tuongzalo.html -->
        <a id="explore-btn" href="tuongzalo.html">🔍 Khám phá</a>

        <!-- Touch Controls -->
        <div id="joystick-base" class="touch-control">
            <div id="joystick-stick"></div>
        </div>
        <div id="btn-fire" class="touch-control btn-action">FIRE</div>
        <div id="btn-boost" class="touch-control btn-action">BOOST</div>
    </div>

    <script>
        // --- SOUND SYNTHESIZER (Web Audio API) ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notice = document.getElementById('sound-notice');
                if (notice) {
                    notice.style.opacity = '0';
                    setTimeout(() => notice.remove(), 500);
                }
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        window.addEventListener('touchstart', initAudio, { once: true });
        window.addEventListener('mousedown', initAudio, { once: true });
        window.addEventListener('keydown', initAudio, { once: true });

        function playLaserSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.12);

            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playHitSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 0.5);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start();
            noise.stop(audioCtx.currentTime + 0.5);
        }

        // --- DYNAMIC TEXTURE GENERATOR ---
        let mapImage = new Image();
        let ufoImage = new Image();

        function createMapTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2400;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');

            const skyGrad = ctx.createLinearGradient(0, 0, 0, 350);
            skyGrad.addColorStop(0, '#0a1128');
            skyGrad.addColorStop(0.5, '#1c2541');
            skyGrad.addColorStop(1, '#480ca8');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, 350);

            const horizonGrad = ctx.createLinearGradient(0, 280, 0, 360);
            horizonGrad.addColorStop(0, '#f72585');
            horizonGrad.addColorStop(1, '#7209b7');
            ctx.fillStyle = horizonGrad;
            ctx.fillRect(0, 280, canvas.width, 80);

            ctx.fillStyle = '#0b090a';
            ctx.beginPath();
            ctx.moveTo(0, 350);
            for (let x = 0; x <= canvas.width; x += 30) {
                let height = Math.sin(x * 0.01) * 60 + Math.cos(x * 0.025) * 40 + Math.sin(x * 0.005) * 80;
                ctx.lineTo(x, 350 - height);
            }
            ctx.lineTo(canvas.width, 500);
            ctx.lineTo(0, 500);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#161a1d';
            ctx.beginPath();
            ctx.moveTo(0, 360);
            for (let x = 0; x <= canvas.width; x += 20) {
                let height = Math.sin(x * 0.02 + 1) * 35 + Math.cos(x * 0.04) * 25;
                ctx.lineTo(x, 360 - height);
            }
            ctx.lineTo(canvas.width, 500);
            ctx.lineTo(0, 500);
            ctx.closePath();
            ctx.fill();

            const lakeGrad = ctx.createLinearGradient(0, 360, 0, 800);
            lakeGrad.addColorStop(0, '#3a0ca3');
            lakeGrad.addColorStop(0.3, '#03045e');
            lakeGrad.addColorStop(1, '#023e8a');
            ctx.fillStyle = lakeGrad;
            ctx.fillRect(0, 360, canvas.width, 440);

            ctx.strokeStyle = 'rgba(247, 37, 133, 0.18)';
            ctx.lineWidth = 2;
            for (let y = 370; y < 800; y += 12) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                for (let x = 0; x < canvas.width; x += 50) {
                    ctx.lineTo(x + Math.sin(x * 0.05 + y) * 5, y);
                }
                ctx.stroke();
            }

            return canvas;
        }

        function createUFOTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#a8dede';
            ctx.beginPath();
            ctx.arc(128, 55, 35, Math.PI, 0);
            ctx.fill();

            const bodyGrad = ctx.createLinearGradient(0, 45, 0, 85);
            bodyGrad.addColorStop(0, '#e0e1dd');
            bodyGrad.addColorStop(0.5, '#778da9');
            bodyGrad.addColorStop(1, '#1b263b');
            ctx.fillStyle = bodyGrad;

            ctx.beginPath();
            ctx.ellipse(128, 65, 90, 25, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#3d5a80';
            ctx.lineWidth = 3;
            ctx.stroke();

            const lightColors = ['#ff0055', '#00ffff', '#ffcc00', '#00ff66', '#ff0055'];
            for (let i = 0; i < 5; i++) {
                ctx.fillStyle = lightColors[i];
                ctx.shadowColor = lightColors[i];
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(58 + i * 35, 68, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            return canvas;
        }

        const mapCanvas = createMapTexture();
        mapImage.src = mapCanvas.toDataURL();

        const ufoCanvas = createUFOTexture();
        ufoImage.src = ufoCanvas.toDataURL();

        // --- GAME LOGIC & CONTROLS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const DIRECTIONS = ["Bắc", "Bắc Đông Bắc", "Đông Đông Bắc", "Đông", "Đông Đông Nam", "Nam Đông Nam", "Nam", "Nam Tây Nam", "Tây Tây Nam", "Tây", "Tây Tây Bắc", "Bắc Tây Bắc"];

        const player = {
            heading: 0,
            pitch: 0,
            roll: 0,
            speed: 150,
            boosting: false,
            x: 0,
            y: 500,
            z: 0
        };

        let ufo = {
            x: 100,
            y: 500,
            z: 800,
            heading: 45,
            speed: 140,
            hits: 0,
            maxHits: 10,
            alive: true,
            explodeTimer: 0
        };

        let bullets = [];
        let particles = [];

        const joystick = { x: 0, y: 0, active: false };
        let isFiring = false;
        let fireCooldown = 0;

        const stickEl = document.getElementById('joystick-stick');
        const baseEl = document.getElementById('joystick-base');

        function updateJoystickPos(touchX, touchY) {
            const rect = baseEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = touchX - centerX;
            let dy = touchY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxDist = rect.width / 2;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joystick.x = dx / maxDist; 
            joystick.y = dy / maxDist; 

            stickEl.style.transform = `translate(${dx}px, ${dy}px)`;
        }

        baseEl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystick.active = true;
            updateJoystickPos(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (!joystick.active) return;
            for (let i = 0; i < e.touches.length; i++) {
                if (e.touches[i].target === baseEl || baseEl.contains(e.touches[i].target)) {
                    updateJoystickPos(e.touches[i].clientX, e.touches[i].clientY);
                    break;
                }
            }
        }, { passive: false });

        const resetJoystick = () => {
            joystick.active = false;
            joystick.x = 0;
            joystick.y = 0;
            stickEl.style.transform = `translate(0px, 0px)`;
        };
        window.addEventListener('touchend', resetJoystick);
        window.addEventListener('touchcancel', resetJoystick);

        const btnFire = document.getElementById('btn-fire');
        const btnBoost = document.getElementById('btn-boost');

        const bindButtonEvents = (btn, onPress, onRelease) => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); btn.classList.add('active'); onPress(); }, { passive: false });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); btn.classList.remove('active'); onRelease(); }, { passive: false });
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); btn.classList.add('active'); onPress(); });
            btn.addEventListener('mouseup', (e) => { e.preventDefault(); btn.classList.remove('active'); onRelease(); });
            btn.addEventListener('mouseleave', () => { btn.classList.remove('active'); onRelease(); });
        };

        bindButtonEvents(btnFire, () => { isFiring = true; }, () => { isFiring = false; });
        bindButtonEvents(btnBoost, () => { player.boosting = true; }, () => { player.boosting = false; });

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') isFiring = true;
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
            if (e.code === 'Space') isFiring = false;
        });

        function resetUFO() {
            ufo.x = player.x + (Math.random() - 0.5) * 1000;
            ufo.y = player.y + (Math.random() - 0.5) * 200;
            ufo.z = player.z + 1200 + Math.random() * 500;
            ufo.heading = Math.random() * 360;
            ufo.hits = 0;
            ufo.alive = true;
        }

        // --- UPDATE GAME ENGINE ---
        function updateGame(dt) {
            let kX = 0, kY = 0;
            
            // HOÁN ĐỔI NÚT A VÀ D THEO YÊU CẦU:
            // Khi nhấn A (hoặc mũi tên trái), máy hiểu là D (gán giá trị sang phải: +1)
            // Khi nhấn D (hoặc mũi tên phải), máy hiểu là A (gán giá trị sang trái: -1)
            if (keys['KeyA'] || keys['ArrowLeft']) kX -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) kX += 1;
            
            if (keys['KeyW'] || keys['ArrowUp']) kY -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) kY += 1;

            const inputX = joystick.active ? joystick.x : kX;
            const inputY = joystick.active ? joystick.y : kY;

            player.heading += inputX * 50 * dt;
            if (player.heading < 0) player.heading += 360;
            if (player.heading >= 360) player.heading -= 360;

            const targetRoll = -inputX * 0.35;
            player.roll += (targetRoll - player.roll) * 0.12;

            player.pitch += inputY * 140 * dt;
            player.pitch = Math.max(-150, Math.min(150, player.pitch));

            player.speed = player.boosting ? 270 : 150;

            const radH = player.heading * Math.PI / 180;
            player.x += Math.sin(radH) * player.speed * dt;
            player.z += Math.cos(radH) * player.speed * dt;

            if (ufo.alive) {
                const ufoRad = ufo.heading * Math.PI / 180;
                ufo.x += Math.sin(ufoRad) * ufo.speed * dt;
                ufo.z += Math.cos(ufoRad) * ufo.speed * dt;
            } else {
                ufo.explodeTimer -= dt;
                if (ufo.explodeTimer <= 0) resetUFO();
            }

            fireCooldown -= dt;
            if (isFiring && fireCooldown <= 0) {
                fireCooldown = 0.12; 
                playLaserSound();

                const aimDist = 600;
                const targetX = player.x + Math.sin(radH) * aimDist;
                const targetY = player.y + player.pitch * 2; 
                const targetZ = player.z + Math.cos(radH) * aimDist;

                bullets.push({
                    x: player.x,
                    y: player.y - 10,
                    z: player.z,
                    vx: (targetX - player.x) / aimDist * 900,
                    vy: (targetY - (player.y - 10)) / aimDist * 900,
                    vz: (targetZ - player.z) / aimDist * 900,
                    life: 1.8
                });
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.life -= dt;
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.z += b.vz * dt;

                if (ufo.alive) {
                    const distToUFO = Math.hypot(b.x - ufo.x, b.y - ufo.y, b.z - ufo.z);
                    if (distToUFO < 75) {
                        ufo.hits++;
                        bullets.splice(i, 1);
                        playHitSound();
                        createExplosion(b.x, b.y, b.z, 12, '#00ffff');

                        if (ufo.hits >= ufo.maxHits) {
                            ufo.alive = false;
                            ufo.explodeTimer = 2.5;
                            playExplosionSound();
                            createExplosion(ufo.x, ufo.y, ufo.z, 65, '#ff3300');
                        }
                        continue;
                    }
                }

                if (b.life <= 0) bullets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.z += p.vz * dt;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function createExplosion(x, y, z, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y, z,
                    vx: (Math.random() - 0.5) * 220,
                    vy: (Math.random() - 0.5) * 220,
                    vz: (Math.random() - 0.5) * 220,
                    life: 0.4 + Math.random() * 0.6,
                    color
                });
            }
        }

        // --- RENDER GAME SCENE & HUD ---
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(player.roll);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            const panoWidth = mapImage.width || 2400;
            const headingRatio = player.heading / 360;
            let bgX = -headingRatio * panoWidth; 
            let bgY = (canvas.height / 2) - (mapImage.height / 2) + player.pitch;

            ctx.drawImage(mapImage, bgX, bgY);
            ctx.drawImage(mapImage, bgX - panoWidth, bgY);
            ctx.drawImage(mapImage, bgX + panoWidth, bgY);

            const dx = ufo.x - player.x;
            const dz = ufo.z - player.z;
            const distanceToUFO = Math.hypot(dx, dz);

            let angleToUFO = Math.atan2(dx, dz) * 180 / Math.PI;
            if (angleToUFO < 0) angleToUFO += 360;

            let relAngle = angleToUFO - player.heading;
            if (relAngle > 180) relAngle -= 360;
            if (relAngle < -180) relAngle += 360;

            let ufoScreenX = canvas.width / 2 + (relAngle / 60) * (canvas.width / 2);
            let ufoScreenY = canvas.height / 2 + player.pitch + ((player.y - ufo.y) / Math.max(1, distanceToUFO)) * 300;

            if (ufo.alive && Math.abs(relAngle) < 70 && distanceToUFO > 25) {
                const scale = Math.max(0.15, Math.min(2.0, 400 / distanceToUFO));
                const w = ufoImage.width * scale;
                const h = ufoImage.height * scale;

                ctx.drawImage(ufoImage, ufoScreenX - w / 2, ufoScreenY - h / 2, w, h);

                if (distanceToUFO < 800) {
                    ctx.strokeStyle = '#ff0033';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(ufoScreenX - w / 2 - 10, ufoScreenY - h / 2 - 10, w + 20, h + 20);

                    ctx.fillStyle = '#ff0033';
                    ctx.font = 'bold 12px monospace';
                    ctx.fillText(`LOCK [${Math.round(distanceToUFO)}m]`, ufoScreenX - w / 2 - 10, ufoScreenY - h / 2 - 16);
                }
            }

            bullets.forEach(b => {
                const bdx = b.x - player.x;
                const bdz = b.z - player.z;
                const bDist = Math.hypot(bdx, bdz);
                let bAngle = Math.atan2(bdx, bdz) * 180 / Math.PI - player.heading;
                if (bAngle > 180) bAngle -= 360;
                if (bAngle < -180) bAngle += 360;

                if (Math.abs(bAngle) < 60) {
                    const bx = canvas.width / 2 + (bAngle / 60) * (canvas.width / 2);
                    const by = canvas.height / 2 + player.pitch + ((player.y - b.y) / Math.max(1, bDist)) * 300;
                    ctx.fillStyle = '#00ffff';
                    ctx.shadowColor = '#00ffff';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(bx, by, Math.max(3, 400 / bDist), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            particles.forEach(p => {
                const pdx = p.x - player.x;
                const pdz = p.z - player.z;
                const pDist = Math.hypot(pdx, pdz);
                let pAngle = Math.atan2(pdx, pdz) * 180 / Math.PI - player.heading;
                if (pAngle > 180) pAngle -= 360;
                if (pAngle < -180) pAngle += 360;

                if (Math.abs(pAngle) < 60) {
                    const px = canvas.width / 2 + (pAngle / 60) * (canvas.width / 2);
                    const py = canvas.height / 2 + player.pitch + ((player.y - p.y) / Math.max(1, pDist)) * 300;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(px, py, Math.max(2, 800 / pDist), 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            ctx.restore();

            drawCockpitHUD(distanceToUFO, relAngle, angleToUFO);
        }

        // --- DRAW HUD & RADAR ---
        function drawCockpitHUD(distToTarget, relAngle, targetAbsoluteHeading) {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(cx, cy, 18, 0, Math.PI * 2);
            ctx.moveTo(cx - 28, cy); ctx.lineTo(cx - 8, cy);
            ctx.moveTo(cx + 8, cy);  ctx.lineTo(cx + 28, cy);
            ctx.moveTo(cx, cy - 28); ctx.lineTo(cx, cy - 8);
            ctx.moveTo(cx, cy + 8);  ctx.lineTo(cx, cy + 28);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0, 255, 204, 0.25)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(cx * 0.4, cy * 0.5);
            ctx.moveTo(canvas.width, 0); ctx.lineTo(canvas.width - cx * 0.4, cy * 0.5);
            ctx.stroke();

            const dirIndex = Math.floor(((player.heading + 15) % 360) / 30);
            const currentDirText = DIRECTIONS[dirIndex];

            ctx.fillStyle = '#00ffcc';
            ctx.font = 'bold 15px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(`| ${Math.round(player.heading)}° ${currentDirText.toUpperCase()} |`, cx, 40);

            ctx.textAlign = 'left';
            ctx.font = '13px monospace';
            ctx.fillText(`TỐC ĐỘ : ${Math.round(player.speed)} m/s`, 20, canvas.height - 110);
            ctx.fillText(`ĐỘ CAO : ${Math.round(player.y)} m`, 20, canvas.height - 90);

            ctx.textAlign = 'right';
            ctx.fillText(`MỤC TIÊU : ${ufo.alive ? 'UFO-X' : 'DESTROYED'}`, canvas.width - 20, canvas.height - 110);
            ctx.fillText(`KHOẢNG CÁCH: ${ufo.alive ? Math.round(distToTarget) + 'm' : '---'}`, canvas.width - 20, canvas.height - 90);

            const radarSize = 110;
            const rx = canvas.width - radarSize - 20;
            const ry = 20;

            ctx.save();
            ctx.fillStyle = 'rgba(0, 20, 30, 0.8)';
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(rx + radarSize / 2, ry + radarSize / 2, radarSize / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(rx + radarSize / 2, ry); ctx.lineTo(rx + radarSize / 2, ry + radarSize);
            ctx.moveTo(rx, ry + radarSize / 2); ctx.lineTo(rx + radarSize, ry + radarSize / 2);
            ctx.stroke();

            if (ufo.alive) {
                const radarScale = (radarSize / 2) / 1500;
                const blipRad = relAngle * Math.PI / 180;
                const blipDist = Math.min(distToTarget, 1500) * radarScale;

                const blipX = rx + radarSize / 2 + Math.sin(blipRad) * blipDist;
                const blipY = ry + radarSize / 2 - Math.cos(blipRad) * blipDist;

                ctx.fillStyle = '#ff0033';
                ctx.beginPath();
                ctx.arc(blipX, blipY, 4, 0, Math.PI * 2);
                ctx.fill();

                const tRad = (targetAbsoluteHeading - player.heading) * Math.PI / 180;
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(blipX, blipY);
                ctx.lineTo(blipX + Math.sin(tRad) * 10, blipY - Math.cos(tRad) * 10);
                ctx.stroke();
            }

            ctx.fillStyle = '#00ffcc';
            ctx.beginPath();
            ctx.arc(rx + radarSize / 2, ry + radarSize / 2, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        let lastTime = performance.now();
        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            updateGame(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        resetUFO();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
