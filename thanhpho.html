<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UFO Shooter | Bắn Đĩa Bay</title>
    <style>
        /* Chặn triệt để bôi đen, chọn text và các hành vi kéo thả trên toàn bộ trang */
        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none; 
            touch-action: manipulation; 
        }
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .hud-top {
            position: absolute;
            top: max(15px, env(safe-area-inset-top));
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .btn-ui {
            background: rgba(0, 20, 40, 0.85);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .status-board {
            display: flex;
            gap: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
        }

        .hud-controls {
            position: absolute;
            bottom: calc(100px + env(safe-area-inset-bottom)); /* Đã sửa lên 100px */
            left: 25px;
            right: 25px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none; /* Cho phép xuyên qua vùng trống */
        }

        /* --- JOYSTICK ẢO THAY THẾ CHO CỤM WASD TRÊN MOBILE --- */
        #joystick-base {
            pointer-events: auto;
            width: 120px;
            height: 120px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        #joystick-stick {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #00ffff 0%, #008888 100%);
            border: 2px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            transform: translate(0px, 0px);
            pointer-events: none;
        }

        .btn-shoot {
            pointer-events: auto;
            background: #ff3366;
            border: none;
            color: white;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.8);
            cursor: pointer;
        }
        .btn-shoot:active { transform: scale(0.95); }
    </style>
</head>
<body onselectstart="return false;" oncontextmenu="return false;">

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div class="hud-top">
            <button class="btn-ui" id="btnLib">📚 Thư viện</button>
            <div class="status-board">
                <div>Level: <span id="levelDisplay">1</span></div>
                <div>Đã hạ: <span id="scoreDisplay">0</span>/10</div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-ui" id="btnMusicTrack">🎵 Đổi bài</button>
                <button class="btn-ui" id="btnExplore">🔍 Khám phá</button>
            </div>
        </div>

        <div class="hud-controls">
            <!-- Joystick thay thế cụm WASD trên mobile -->
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
            
            <button class="btn-shoot" id="btnShoot">BẮN</button>
        </div>
    </div>

    <audio id="bgMusic" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const MAP_WIDTH = 1280;
        const MAP_HEIGHT = 720;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let level = 1;
        let ufoSpeedMultiplier = 0.5;

        let ufos = [];
        let bullets = [];
        
        let focusPoint = { x: MAP_WIDTH / 2, y: MAP_HEIGHT / 2 };
        let keys = {};
        let muzzleFlashTimer = 0;

        // Xử lý Joystick di động
        let joystick = { active: false, x: 0, y: 0 };
        const baseEl = document.getElementById('joystick-base');
        const stickEl = document.getElementById('joystick-stick');

        function updateJoystick(clientX, clientY) {
            const rect = baseEl.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxDist = rect.width / 2 - 10;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            stickEl.style.transform = `translate(${dx}px, ${dy}px)`;
            joystick.x = dx / maxDist;
            joystick.y = dy / maxDist;
        }

        baseEl.addEventListener('touchstart', e => {
            e.preventDefault();
            joystick.active = true;
            updateJoystick(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});

        window.addEventListener('touchmove', e => {
            if (!joystick.active) return;
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                updateJoystick(e.touches[i].clientX, e.touches[i].clientY);
            }
        }, {passive: false});

        const resetJoystick = () => {
            if (!joystick.active) return;
            joystick.active = false;
            joystick.x = 0;
            joystick.y = 0;
            stickEl.style.transform = `translate(0px, 0px)`;
        };

        window.addEventListener('touchend', resetJoystick);
        window.addEventListener('touchcancel', resetJoystick);

        document.getElementById('btnLib').addEventListener('click', () => {
            window.location.href = 'tuongzalo.html';
        });

        document.getElementById('btnExplore').addEventListener('click', () => {
            window.location.href = 'tuongzalo.html';
        });

        const bgImage = new Image();
        bgImage.src = 'background.png';

        const fgImage = new Image();
        fgImage.src = 'background2.png';

        // Xử lý âm thanh an toàn cho iOS
        const bgMusic = document.getElementById('bgMusic');
        let currentTrack = 1;
        
        function playMusic(trackNum) {
            currentTrack = trackNum;
            bgMusic.src = `${currentTrack}.mp3`;
            bgMusic.volume = 0.6;
            bgMusic.play().catch(() => {
                const unlockAudio = () => {
                    bgMusic.play();
                    window.removeEventListener('touchstart', unlockAudio);
                    window.removeEventListener('click', unlockAudio);
                };
                window.addEventListener('touchstart', unlockAudio, { once: true });
                window.addEventListener('click', unlockAudio, { once: true });
            });
        }
        
        bgMusic.addEventListener('ended', () => {
            let next = currentTrack >= 9 ? 1 : currentTrack + 1;
            playMusic(next);
        });
        playMusic(1);

        document.getElementById('btnMusicTrack').addEventListener('click', () => {
            let next = currentTrack >= 9 ? 1 : currentTrack + 1;
            playMusic(next);
        });

        const flightPaths = [
            [{x: 1330, y: 320}, {x: 980, y: 220}, {x: 580, y: 270}, {x: 230, y: 170}, {x: -50, y: 100}],
            [{x: 1330, y: 220}, {x: 930, y: 320}, {x: 530, y: 250}, {x: 180, y: 330}, {x: -50, y: 260}],
            [{x: 1330, y: 560}, {x: 980, y: 490}, {x: 580, y: 530}, {x: 230, y: 460}, {x: -50, y: 410}]
        ];

        function spawnUFO() {
            let pathIndex = Math.floor(Math.random() * flightPaths.length);
            ufos.push({
                path: flightPaths[pathIndex],
                progress: 0,
                speed: (0.0012 + Math.random() * 0.0015) * ufoSpeedMultiplier,
                radius: 40
            });
        }

        for(let i = 0; i < 4; i++) spawnUFO();

        // Bàn phím máy tính (WASD)
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        document.getElementById('btnShoot').addEventListener('click', fireBullet);
        document.getElementById('btnShoot').addEventListener('touchstart', (e) => {
            e.preventDefault();
            fireBullet();
        }, {passive: false});

        function fireBullet() {
            muzzleFlashTimer = 6;
            bullets.push({
                x: MAP_WIDTH / 2,
                y: MAP_HEIGHT - 40,
                targetX: focusPoint.x,
                targetY: focusPoint.y,
                speed: 35
            });
        }

        function getPointOnPath(path, t) {
            let len = path.length - 1;
            let exact = t * len;
            let index = Math.floor(exact);
            if (index >= len) return { ...path[len], z: 1.1 };
            let nextIndex = index + 1;
            let localT = exact - index;
            
            let p1 = path[index];
            let p2 = path[nextIndex];
            return {
                x: p1.x + (p2.x - p1.x) * localT,
                y: p1.y + (p2.y - p1.y) * localT,
                z: 0.35 + t * 0.75
            };
        }

        function update() {
            let speed = 9;
            let moveX = 0;
            let moveY = 0;

            if (keys['KeyA']) moveX -= 1;
            if (keys['KeyD']) moveX += 1;
            if (keys['KeyW']) moveY -= 1;
            if (keys['KeyS']) moveY += 1;

            if (joystick.active) {
                moveX = joystick.x;
                moveY = joystick.y;
            }

            focusPoint.x += moveX * speed;
            focusPoint.y += moveY * speed;

            focusPoint.x = Math.max(50, Math.min(MAP_WIDTH - 50, focusPoint.x));
            focusPoint.y = Math.max(50, Math.min(MAP_HEIGHT - 50, focusPoint.y));

            if (muzzleFlashTimer > 0) muzzleFlashTimer--;

            for (let i = ufos.length - 1; i >= 0; i--) {
                ufos[i].progress += ufos[i].speed;
                if (ufos[i].progress >= 1.0) {
                    ufos.splice(i, 1);
                    spawnUFO();
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                let dx = b.targetX - b.x;
                let dy = b.targetY - b.y;
                let dist = Math.hypot(dx, dy);
                if (dist < b.speed) {
                    for (let j = ufos.length - 1; j >= 0; j--) {
                        let ufo = ufos[j];
                        let pos = getPointOnPath(ufo.path, ufo.progress);
                        let renderSize = ufo.radius * pos.z;
                        if (Math.hypot(b.targetX - pos.x, b.targetY - pos.y) < renderSize + 25) {
                            score++;
                            document.getElementById('scoreDisplay').innerText = score;

                            if (score >= 10) {
                                level++;
                                score = 0;
                                ufoSpeedMultiplier += 0.10;
                                document.getElementById('levelDisplay').innerText = level;
                                document.getElementById('scoreDisplay').innerText = score;
                            }

                            ufos.splice(j, 1);
                            spawnUFO();
                            break;
                        }
                    }
                    bullets.splice(i, 1);
                } else {
                    b.x += (dx / dist) * b.speed;
                    b.y += (dy / dist) * b.speed;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            let scaleX = canvas.width / MAP_WIDTH;
            let scaleY = canvas.height / MAP_HEIGHT;
            let scale = Math.max(scaleX, scaleY);
            
            let offsetX = (canvas.width - MAP_WIDTH * scale) / 2;
            let offsetY = (canvas.height - MAP_HEIGHT * scale) / 2;

            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                ctx.drawImage(bgImage, 0, 0, MAP_WIDTH, MAP_HEIGHT);
            }

            ufos.forEach(ufo => {
                let pos = getPointOnPath(ufo.path, ufo.progress);
                let r = ufo.radius * pos.z;
                
                ctx.save();
                ctx.translate(pos.x, pos.y);

                ctx.fillStyle = `rgba(0, 255, 255, ${Math.min(1, pos.z * 1.2)})`;
                ctx.beginPath();
                ctx.ellipse(0, 0, r, r * 0.35, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = `rgba(255, 51, 153, ${Math.min(1, pos.z * 1.2)})`;
                ctx.beginPath();
                ctx.arc(0, -r * 0.15, r * 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            });

            if (fgImage.complete && fgImage.naturalWidth !== 0) {
                ctx.drawImage(fgImage, 0, 0, MAP_WIDTH, MAP_HEIGHT);
            }

            bullets.forEach(b => {
                ctx.fillStyle = '#ff3366';
                ctx.shadowColor = '#ff3366';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            let gunX = MAP_WIDTH / 2;
            let gunY = MAP_HEIGHT - 30;
            
            ctx.save();
            ctx.translate(gunX, gunY);

            ctx.fillStyle = '#0a192f';
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.rect(-45, 0, 90, 30);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(-30, 8, 60, 4);

            let angle = Math.atan2(focusPoint.y - gunY, focusPoint.x - gunX);
            ctx.rotate(angle);

            ctx.fillStyle = '#172a45';
            ctx.fillRect(0, -14, 70, 28);
            ctx.strokeStyle = '#64ffda';
            ctx.strokeRect(0, -14, 70, 28);

            ctx.fillStyle = '#00ffff';
            ctx.fillRect(20, -10, 8, 20);
            ctx.fillRect(38, -10, 8, 20);
            ctx.fillRect(56, -10, 8, 20);

            if (muzzleFlashTimer > 0) {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(70, 0);
                ctx.lineTo(95, -15);
                ctx.lineTo(85, 0);
                ctx.lineTo(95, 15);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();

            ctx.strokeStyle = 'rgba(255, 51, 102, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(gunX, gunY - 10);
            ctx.lineTo(focusPoint.x, focusPoint.y);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(focusPoint.x, focusPoint.y, 20, 0, Math.PI * 2);
            ctx.moveTo(focusPoint.x - 28, focusPoint.y); ctx.lineTo(focusPoint.x + 28, focusPoint.y);
            ctx.moveTo(focusPoint.x, focusPoint.y - 28); ctx.lineTo(focusPoint.x, focusPoint.y + 28);
            ctx.stroke();

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
