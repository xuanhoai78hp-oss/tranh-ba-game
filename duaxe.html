<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Săn Tội Phạm Xuyên Thời Không - GP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap');

/* ĐÃ SỬA: Bỏ touch-action: none để không chặn cảm biến Gyro trên mobile */
* { 
  box-sizing: border-box; 
  user-select: none; 
  -webkit-user-select: none; 
  -webkit-touch-callout: none; 
}

body { margin: 0; overflow: hidden; background: #0b1329; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; touch-action: manipulation; }
#canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

.hud-overlay { position: relative; z-index: 10; pointer-events: none; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
.interactive { pointer-events: auto; }

.info-panel { background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 16px; padding: 12px 20px; color: #fff; max-width: 320px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); }
.info-panel h1 { margin: 0; font-size: 16px; color: #d4af37; font-family: 'ZCOOL KuaiLe', cursive; text-shadow: 0 0 10px rgba(212, 175, 55, 0.6); }
.info-panel p { margin: 4px 0 0 0; font-size: 11px; color: #cbd5e1; }

.status-badge { background: rgba(0, 0, 0, 0.75); border: 1px solid #d4af37; color: #facc15; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; font-family: 'ZCOOL KuaiLe', cursive; text-shadow: 0 0 8px rgba(250, 204, 21, 0.6); }

.progress-container { width: 200px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #ef4444); transition: width 0.2s; }

#flash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255, 0, 0, 0); z-index: 99; pointer-events: none; transition: background 0.15s; }

/* SPRITE SHEET 5 KHUNG HÌNH (200x400px mỗi khung) */
#character-sprite {
position: absolute; bottom: 15vh; left: 50%; transform: translateX(-50%);
width: 200px; height: 35vh; max-height: 380px;
background: url('duaxe.png') 0 0 / 1000px 100% no-repeat;
z-index: 5; pointer-events: none; transition: transform 0.05s linear;
}

#cockpit {
position: absolute; bottom: 0; left: 0; width: 100vw; height: 16vh;
background: linear-gradient(180deg, rgba(15,23,42,0.6) 0%, rgba(15,23,42,0.98) 100%);
border-top: 3px solid #334155; display: flex; justify-content: space-between; align-items: center; padding: 0 25px;
z-index: 6; pointer-events: auto;
}

.dashboard {
display: flex; gap: 15px; align-items: center; background: rgba(0,0,0,0.85);
padding: 6px 18px; border-radius: 35px; border: 1px solid #475569;
}
.gauge {
width: 60px; height: 60px; border-radius: 50%; border: 3px solid #38bdf8;
display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; font-size: 8px;
}
.gauge-val { font-size: 14px; font-weight: bold; color: #facc15; }
.gear-box { font-size: 20px; font-weight: bold; color: #ef4444; background: #000; padding: 4px 12px; border-radius: 8px; border: 1px solid #ef4444; }

.touch-zone { position: absolute; top: 0; width: 50vw; height: 84vh; z-index: 8; pointer-events: auto; }
#left-zone { left: 0; }
#right-zone { right: 0; }

#dragon-modal {
position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 15, 0.9);
display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px);
}
.modal-content {
background: linear-gradient(135deg, #18120b, #2b1d0c); border: 3px solid #d4af37; padding: 35px; border-radius: 24px;
text-align: center; color: #fef08a; max-width: 420px; width: 90%; box-shadow: 0 0 50px rgba(212, 175, 55, 0.4);
animation: modalPop 0.4s ease-out;
}
.modal-content h2 { color: #facc15; margin-top: 0; font-size: 26px; font-family: 'Ma Shan Zheng', cursive; letter-spacing: 2px; text-shadow: 0 0 12px rgba(250, 204, 21, 0.8); }
.modal-content p { color: #f1f5f9; font-size: 15px; line-height: 1.6; margin-bottom: 25px; font-family: 'ZCOOL KuaiLe', cursive; }
.btn-luyen {
background: linear-gradient(135deg, #b91c1c, #7f1d1d); color: #fef08a; border: 2px solid #d4af37; padding: 14px 28px;
font-size: 18px; font-family: 'Ma Shan Zheng', cursive; font-weight: bold; letter-spacing: 2px; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 20px rgba(185, 28, 28, 0.6); transition: transform 0.2s, background 0.2s; width: 100%;
}
@keyframes modalPop { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<div id="dragon-modal">
<div class="modal-content">
<h2 id="modal-title">🚨 Bắt Giữ Tội Phạm Thành Công!</h2>
<p id="modal-desc">Đã tóm gọn tội phạm xuyên thời không!</p>
<button class="btn-luyen interactive" id="modal-btn" onclick="closeOrNext()">Tiếp tục tuần tra</button>
</div>
</div>

<audio id="bg-music" loop></audio>

<div id="flash-screen"></div>
<div id="canvas-container"></div>

<div id="character-sprite"></div>

<div id="cockpit">
<div style="color: #94a3b8; font-size: 11px;">⚙️ Vuốt Trái: Lên/Xuống Số<br>(Buông ga mới sang số)</div>
<div class="dashboard">
<div class="gauge"><span>RPM</span><span class="gauge-val" id="val-rpm">1000</span></div>
<div class="gear-box" id="val-gear">N</div>
<div class="gauge"><span>KM/H</span><span class="gauge-val" id="val-speed">0</span></div>
</div>
<div style="color: #94a3b8; font-size: 11px; text-align: right;">✊ Vuốt Phải: Kéo Ga<br>Nghiêng điện thoại lái (Gyro)</div>
</div>

<div class="touch-zone" id="left-zone"></div>
<div class="touch-zone" id="right-zone"></div>

<div class="hud-overlay">
<div style="display: flex; justify-content: space-between; align-items: flex-start;">
<div class="info-panel">
<h1>🚨 Săn Tội Phạm Xuyên Thời Không</h1>
<p><span id="speed-display" style="color: #facc15; font-weight: bold;">Tốc độ: 0 km/h</span> | >180 km/h trong 10s để bắt!</p>
<div class="progress-container"><div id="distance-bar" class="progress-bar"></div></div>
</div>
<div class="status-badge">
<span id="hunt-count-text">Đã bắt: 0/7 tên</span>
</div>
</div>
<div></div>
</div>

<script>
let isGamePaused = false;
let collectedCriminalCount = 0;
let targetPage = '';

let currentSpeedKmh = 0;
let highSpeedTimer = 0;

let throttle = 0;
let gear = 0; 
let rpm = 1000;
let steerAngle = 0; 

let spriteFrameTimer = 0;
let currentFrame = 0;

let audioCtx = null;
let oscBass, oscTreble, engineGain;

function initAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
oscBass = audioCtx.createOscillator();
oscTreble = audioCtx.createOscillator();
engineGain = audioCtx.createGain();

oscBass.type = 'triangle';
oscTreble.type = 'sawtooth';
oscBass.frequency.setValueAtTime(55, audioCtx.currentTime);
oscTreble.frequency.setValueAtTime(110, audioCtx.currentTime);

const bassGain = audioCtx.createGain(); bassGain.gain.value = 0.1;
const trebleGain = audioCtx.createGain(); trebleGain.gain.value = 0.2;

oscBass.connect(bassGain); bassGain.connect(engineGain);
oscTreble.connect(trebleGain); trebleGain.connect(engineGain);
engineGain.connect(audioCtx.destination);
engineGain.gain.setValueAtTime(0.2, audioCtx.currentTime);

oscBass.start();
oscTreble.start();
playRandomMusic();
}
}

// KÍCH HOẠT GYRO & BẢNG XÁC NHẬN CHUẨN USER GESTURE (BẮT BUỘC TRÊN iOS)
function requestGyroPermission() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    // Ép gọi trực tiếp trong luồng sự kiện chạm/click của người dùng
    DeviceOrientationEvent.requestPermission().then(response => {
      if (response === 'granted') {
        window.addEventListener('deviceorientation', handleGyro);
        console.log("Gyro đã được cấp quyền!");
      } else {
        console.log("Người dùng từ chối quyền Gyro.");
      }
    }).catch(error => {
      console.error("Lỗi khi xin quyền Gyro:", error);
    });
  } else {
    // Các trình duyệt Android hoặc PC không cần xin phép ngầm
    window.addEventListener('deviceorientation', handleGyro);
  }
}
function handleGyro(e) {
console.log("gamma:", e.gamma); // Debug kiểm tra dữ liệu cảm biến
let gamma = e.gamma || 0;
steerAngle = Math.max(-1, Math.min(1, gamma / 25));
}

function updateEngineSound() {
if (!audioCtx) return;
let baseFreq = 40 + (rpm / 9000) * 450;
oscBass.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.03);
oscTreble.frequency.setTargetAtTime(baseFreq * 2, audioCtx.currentTime, 0.03);
}

function playShiftSound() {
if (!audioCtx) return;
let now = audioCtx.currentTime;
let osc = audioCtx.createOscillator();
let gain = audioCtx.createGain();
osc.type = 'square';
osc.frequency.setValueAtTime(180, now);
osc.frequency.setValueAtTime(90, now + 0.04);
gain.gain.setValueAtTime(0.4, now);
gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(now); osc.stop(now + 0.08);
}

const bgMusic = document.getElementById('bg-music');
function playRandomMusic() {
let randomTrack = Math.floor(Math.random() * 9) + 1;
bgMusic.src = `${randomTrack}.mp3`;
bgMusic.volume = 0.5;
bgMusic.play().catch(e => console.log("Audio waiting"));
}

function playSound(type) {
if (!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain); gain.connect(audioCtx.destination);

if (type === 'hit') {
osc.type = 'sawtooth';
osc.frequency.setValueAtTime(100, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.3);
gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
osc.start(); osc.stop(audioCtx.currentTime + 0.3);
} else if (type === 'catch') {
osc.type = 'sine';
osc.frequency.setValueAtTime(600, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.5);
gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}
}

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060b19);
// GIẢM SƯƠNG MÙ ĐỂ KHÔNG NUỐT MẤT TỘI PHẠM Ở XA
scene.fog = new THREE.FogExp2(0x060b19, 0.0006);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xdff0ff, 0.7));
const sunLight = new THREE.DirectionalLight(0xff7733, 1.8);
sunLight.position.set(150, 200, 100);
scene.add(sunLight);

const playerGroup = new THREE.Group();
scene.add(playerGroup);
const hoverOffset = 2.4;

// TỘI PHẠM XUYÊN KHÔNG GIAN (PHÓNG TO SCALE 4x ĐỂ DỄ NHÌN, SPAWN GẦN -60 ĐẾN -80)
const criminalGroup = new THREE.Group();
const crimWheel = new THREE.Mesh(
  new THREE.CylinderGeometry(1.2, 1.2, 0.6, 24),
  new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.6 })
);
crimWheel.rotation.z = Math.PI / 2;
crimWheel.position.set(0, 1.0, 0.5);
criminalGroup.add(crimWheel);

const crimBody = new THREE.Mesh(
  new THREE.ConeGeometry(0.85, 1.6, 16),
  new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.2, metalness: 0.8 })
);
crimBody.position.set(0, 1.6, -0.2);
criminalGroup.add(crimBody);

const crimHelmet = new THREE.Mesh(
  new THREE.SphereGeometry(0.7, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.1, metalness: 0.9, emissive: 0x991b1b })
);
crimHelmet.position.set(0, 2.6, -0.1);
criminalGroup.add(crimHelmet);

criminalGroup.scale.set(4, 4, 4); // Phóng to model
scene.add(criminalGroup);

function respawnCriminal() {
let targetZ = playerGroup.position.z - 70 - Math.random() * 20; // Spawn gần trong tầm mắt
let targetRoadY = getRoadHeightAtZ(targetZ);
criminalGroup.position.set(
getRoadCurveAtZ(targetZ) + (Math.random() - 0.5) * 15,
targetRoadY + 3.5,
targetZ
);
}
respawnCriminal();

function getRoadHeightAtZ(z) {
let progress = Math.abs(z) / 2400;
return THREE.MathUtils.lerp(65, 5, progress % 1);
}
function getRoadCurveAtZ(z) {
return Math.sin(z * 0.003) * 20;
}

function createEnvironment() {
const waterMesh = new THREE.Mesh(
new THREE.BoxGeometry(2000, 2, 3000),
new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.1, metalness: 0.8, transparent: true, opacity: 0.8 })
);
waterMesh.position.set(0, -1, -800);
scene.add(waterMesh);

const mountainMat = new THREE.MeshStandardMaterial({ color: 0x1b4d3e, roughness: 0.8 });
const roadSegments = 100;
for(let j = 0; j < roadSegments; j++) {
let zCoord = -20 - (j * 25);
let roadY = getRoadHeightAtZ(zCoord);
let roadX = getRoadCurveAtZ(zCoord);
const roadGroup = new THREE.Group();
roadGroup.add(new THREE.Mesh(new THREE.BoxGeometry(45, 3, 26), mountainMat));
const pillarGeo = new THREE.CylinderGeometry(4, 6, roadY + 10, 8);
let p1 = new THREE.Mesh(pillarGeo, mountainMat); p1.position.set(-18, -roadY/2, 0);
let p2 = new THREE.Mesh(pillarGeo, mountainMat); p2.position.set(18, -roadY/2, 0);
roadGroup.add(p1); roadGroup.add(p2);
roadGroup.position.set(roadX, roadY, zCoord);
scene.add(roadGroup);
}
}
createEnvironment();

let initialZ = 0;
playerGroup.position.set(getRoadCurveAtZ(initialZ), getRoadHeightAtZ(initialZ) + hoverOffset, initialZ);

// TƯƠNG TÁC GA & SỐ (GỌI TRỰC TIẾP REQUEST GYRO PERMISSION TỪ SỰ KIỆN TOUCH)
const rightZone = document.getElementById('right-zone');
const leftZone = document.getElementById('left-zone');
let startYRight = 0, startYLeft = 0;

rightZone.addEventListener('touchstart', e => { 
  initAudio(); 
  requestGyroPermission(); 
  startYRight = e.touches[0].clientY; 
});
rightZone.addEventListener('touchmove', e => {
let deltaY = e.touches[0].clientY - startYRight;
if (deltaY > 10) throttle = Math.min(1, deltaY / 60);
});
rightZone.addEventListener('touchend', () => { throttle = 0; });

leftZone.addEventListener('touchstart', e => { 
  initAudio(); 
  requestGyroPermission(); 
  startYLeft = e.touches[0].clientY; 
});
leftZone.addEventListener('touchend', e => {
let deltaY = e.changedTouches[0].clientY - startYLeft;
if (deltaY > 30) {
if (throttle < 0.15 && gear < 5) { gear++; playShiftSound(); }
} else if (deltaY < -30 && gear > 0) { gear--; playShiftSound(); }
document.getElementById('val-gear').innerText = gear === 0 ? 'N' : gear;
});

const keys = {};
window.addEventListener('keydown', e => { if (!isGamePaused) { initAudio(); keys[e.code] = true; } });
window.addEventListener('keyup', e => keys[e.code] = false);

function triggerHitEffect() {
playSound('hit');
const flash = document.getElementById('flash-screen');
flash.style.background = 'rgba(255, 0, 0, 0.4)';
setTimeout(() => flash.style.background = 'rgba(255,0,0,0)', 150);
currentSpeedKmh = Math.max(0, currentSpeedKmh - 25);
}

function closeOrNext() {
document.getElementById('dragon-modal').style.display = 'none';
if (targetPage) {
window.location.href = targetPage;
} else {
let curZ = playerGroup.position.z;
playerGroup.position.set(getRoadCurveAtZ(curZ), getRoadHeightAtZ(curZ) + hoverOffset, curZ);
respawnCriminal();
currentSpeedKmh = 0;
highSpeedTimer = 0;
isGamePaused = false;
}
}

function animate() {
requestAnimationFrame(animate);
if (isGamePaused) return;

let maxSpeedForGear = [0, 80, 120, 150, 190, 230][gear];
let accelerationRate = [0, 1.2, 0.9, 0.7, 0.5, 0.4][gear];

if (gear === 0) {
currentSpeedKmh *= 0.95;
rpm = 1000 + throttle * 7500;
} else {
if (throttle > 0) {
currentSpeedKmh += throttle * accelerationRate;
if (currentSpeedKmh > maxSpeedForGear) currentSpeedKmh = maxSpeedForGear;
} else {
currentSpeedKmh *= 0.985;
}
rpm = 1200 + (currentSpeedKmh / (maxSpeedForGear || 1)) * 6800;
}

updateEngineSound();

document.getElementById('val-speed').innerText = Math.round(currentSpeedKmh);
document.getElementById('val-rpm').innerText = Math.round(rpm);
document.getElementById('speed-display').innerText = `Tốc độ: ${Math.floor(currentSpeedKmh)} km/h`;

// ĐỔI KHUNG HÌNH SPRITE 5 KHUNG THEO TỐC ĐỘ
if (currentSpeedKmh > 10) {
spriteFrameTimer += currentSpeedKmh;
if (spriteFrameTimer > 250) {
currentFrame = (currentFrame + 1) % 5;
spriteFrameTimer = 0;
document.getElementById('character-sprite').style.backgroundPosition = `-${currentFrame * 200}px 0px`;
}
}

let distanceToCriminalZ = Math.abs(playerGroup.position.z - criminalGroup.position.z);
if (currentSpeedKmh > 180) {
highSpeedTimer += 0.016;
if (highSpeedTimer >= 10 || distanceToCriminalZ < 35) {
  triggerCatchCriminal();
}
} else {
highSpeedTimer = Math.max(0, highSpeedTimer - 0.05);
}

let progressPercent = Math.min(100, (highSpeedTimer / 10) * 100);
document.getElementById('distance-bar').style.width = progressPercent + '%';

let playerSpeed = (currentSpeedKmh / 60) * 1.4;
playerGroup.position.z -= playerSpeed;

// VÒNG LẶP MAP VÔ TẬN (INFINITE LOOP MAP)
if (playerGroup.position.z < -2400) {
playerGroup.position.z += 2400;
}

let targetRoadY = getRoadHeightAtZ(playerGroup.position.z);
let targetRoadX = getRoadCurveAtZ(playerGroup.position.z);

criminalGroup.position.z -= playerSpeed * 0.85;

// ĐIỀU KIỆN RESPAWN AN TOÀN (KHI KHOẢNG CÁCH QUÁ XA HOẶC BỊ BỎ LẠI PHÍA SAU)
if (playerGroup.position.z - criminalGroup.position.z > 200 || criminalGroup.position.z > playerGroup.position.z) {
respawnCriminal();
}

// ĐIỀU KHIỂN HƯỚNG LÁI KẾT HỢP GYRO & PHÍM A/D
let moveX = 0;
if (keys['KeyKeyA'] || keys['ArrowLeft']) moveX -= 1; // Sửa lỗi gõ phím
if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;
moveX += steerAngle * 1.8;

let desiredX = targetRoadX + moveX * 0.6;
let roadHalfWidth = 21.5;
if (Math.abs(desiredX - targetRoadX) > roadHalfWidth) {
triggerHitEffect();
desiredX = targetRoadX + Math.sign(desiredX - targetRoadX) * roadHalfWidth;
}

playerGroup.position.x = desiredX;
playerGroup.position.y = targetRoadY + hoverOffset;

let spriteRot = moveX * 12;
document.getElementById('character-sprite').style.transform = `translateX(-50%) rotate(${spriteRot}deg)`;

const targetCamPos = new THREE.Vector3(playerGroup.position.x * 0.4, playerGroup.position.y + 4.5, playerGroup.position.z + 13);
camera.position.lerp(targetCamPos, 0.1);
camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z - 12);

renderer.render(scene, camera);
}

function triggerCatchCriminal() {
isGamePaused = true;
playSound('catch');
if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

collectedCriminalCount++;
document.getElementById('hunt-count-text').innerText = `Đã bắt: ${collectedCriminalCount}/7 tên`;

const modalTitle = document.getElementById('modal-title');
const modalDesc = document.getElementById('modal-desc');
const modalBtn = document.getElementById('modal-btn');

if (collectedCriminalCount >= 7) {
modalTitle.innerText = "🏆 Triệt Phá Thành Công Băng Đảng!";
modalDesc.innerHTML = "Đã tóm gọn toàn bộ 7 tên tội phạm xuyên thời không!";
modalBtn.innerText = "✨ Hoàn thành nhiệm vụ";
targetPage = 'hoanthanh.html';
} else {
modalTitle.innerText = "🚨 Bắt Giữ Tội Phạm Thành Công!";
modalDesc.innerHTML = `Đã bắt ${collectedCriminalCount}/7 tên tội phạm.<br>Tốc độ truy đuổi quá đỉnh!`;
modalBtn.innerText = "⚡ Tiếp tục tuần tra";
targetPage = '';
}

document.getElementById('dragon-modal').style.display = 'flex';
}

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
