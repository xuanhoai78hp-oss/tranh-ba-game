<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trình Duyệt Tối Giản</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

/* Thanh địa chỉ siêu gọn, tự động trượt lên ẩn đi khi không dùng */
#url-bar-container {
position: fixed;
top: env(safe-area-inset-top, 10px);
left: 10px;
right: 10px;
height: 40px;
background: rgba(15, 23, 42, 0.85);
backdrop-filter: blur(10px);
border: 1px solid rgba(255, 255, 255, 0.2);
border-radius: 20px;
display: flex;
align-items: center;
padding: 0 12px;
z-index: 1000;
transition: transform 0.3s ease, opacity 0.3s ease;
}

#url-bar-container.hidden {
transform: translateY(-60px);
opacity: 0;
pointer-events: none;
}

#url-input {
flex: 1;
background: transparent;
border: none;
color: #fff;
font-size: 14px;
outline: none;
padding: 0 8px;
}

.nav-btn {
background: none;
border: none;
color: #facc15;
font-size: 14px;
font-weight: bold;
cursor: pointer;
padding: 4px 8px;
}

/* Khung hiển thị trang web (Iframe) */
#web-frame {
width: 100%;
height: 100%;
border: none;
background: #fff;
padding-top: env(safe-area-inset-top, 0px);
}

/* Nút nhỏ nổi lên để gọi lại thanh địa chỉ khi bị ẩn */
#toggle-btn {
position: fixed;
top: 10px;
right: 15px;
width: 32px;
height: 32px;
background: rgba(0, 0, 0, 0.6);
border: 1px solid rgba(255, 255, 255, 0.3);
border-radius: 50%;
color: #fff;
font-size: 12px;
display: flex;
align-items: center;
justify-content: center;
z-index: 999;
cursor: pointer;
}
</style>
</head>
<body>

<!-- Nút gọi nhanh thanh địa chỉ -->
<div id="toggle-btn" onclick="toggleUrlBar()">🌐</div>

<!-- Thanh địa chỉ tối giản -->
<div id="url-bar-container">
<button class="nav-btn" onclick="goBack()">◀</button>
<input type="text" id="url-input" placeholder="Nhập địa chỉ web (VD: https://google.com)..." onkeypress="handleNav(event)">
<button class="nav-btn" onclick="loadWeb()">🔍</button>
</div>

<!-- Nội dung web duyệt qua Iframe -->
<iframe id="web-frame" src="https://www.google.com"></iframe>

<script>
const urlInput = document.getElementById('url-input');
const webFrame = document.getElementById('web-frame');
const urlBar = document.getElementById('url-bar-container');

function loadWeb() {
let url = urlInput.value.trim();
if (!url) return;
if (!url.startsWith('http://') && !url.startsWith('https://')) {
// Nếu gõ từ khóa không phải link, tự động search Google
if (!url.includes('.') || url.includes(' ')) {
url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
} else {
url = 'https://' + url;
}
}
webFrame.src = url;
urlBar.classList.add('hidden'); // Tự ẩn thanh địa chỉ khi load xong web để rộng màn hình
}

function handleNav(e) {
if (e.key === 'Enter') {
loadWeb();
}
}

function toggleUrlBar() {
urlBar.classList.toggle('hidden');
}

// Chạm vào màn hình web thì tự động ẩn thanh địa chỉ đi cho rộng
window.addEventListener('touchstart', (e) => {
if (!e.target.closest('#url-bar-container') && !e.target.closest('#toggle-btn')) {
urlBar.classList.add('hidden');
}
});
</script>

</body>
</html>
