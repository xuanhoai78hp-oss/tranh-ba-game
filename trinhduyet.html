<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hub Game Tụi Mình</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* Container chứa thanh địa chỉ và lưới danh sách game */
        #ui-container {
            position: fixed;
            top: env(safe-area-inset-top, 10px);
            left: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        #ui-container.hidden {
            transform: translateY(-80px);
            opacity: 0;
            pointer-events: none;
        }

        /* Thanh địa chỉ tối giản */
        #url-bar-container {
            height: 40px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }

        #url-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
            padding: 0 8px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #facc15;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* Lưới danh sách game: 3 nút 1 hàng, cuộn dọc, căn chỉnh chuẩn xác */
        #game-shortcuts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-height: 220px; /* Hiển thị gọn vài hàng, có thể cuộn dọc xem hết kho game */
            overflow-y: auto;
            padding: 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(250, 204, 21, 0.4) transparent;
        }
        #game-shortcuts::-webkit-scrollbar {
            width: 4px;
        }
        #game-shortcuts::-webkit-scrollbar-thumb {
            background: rgba(250, 204, 21, 0.4);
            border-radius: 4px;
        }

        .game-chip {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(250, 204, 21, 0.3);
            color: #fde047;
            padding: 8px 6px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .game-chip:active {
            transform: scale(0.95);
            background: rgba(250, 204, 21, 0.2);
        }

        /* Khung hiển thị trang web (Iframe) */
        #web-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Nút nhỏ nổi lên để gọi lại menu khi bị ẩn */
        #toggle-btn {
            position: fixed;
            top: 10px;
            right: 15px;
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            cursor: pointer;
        }
    </style>
</head>

    <!-- Mặc định load game mới nhất (Thành Phố) -->
    <iframe id="web-frame" src="https://tranh-ba-game-gw3q.vercel.app/thanhpho.html"></iframe>

    <script>
        const urlInput = document.getElementById('url-input');
        const webFrame = document.getElementById('web-frame');
        const uiContainer = document.getElementById('ui-container');

        function loadWeb() {
            let url = urlInput.value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                if (!url.includes('.') || url.includes(' ')) {
                    url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
                } else {
                    url = 'https://' + url;
                }
            }
            webFrame.src = url;
            uiContainer.classList.add('hidden');
        }

        function openGame(url) {
            urlInput.value = url;
            webFrame.src = url;
            uiContainer.classList.add('hidden');
        }

        function handleNav(e) {
            if (e.key === 'Enter') {
                loadWeb();
            }
        }

        function toggleUi() {
            uiContainer.classList.toggle('hidden');
        }

        // Tự động ẩn giao diện khi chạm vào màn hình chơi game cho rộng thoáng
        window.addEventListener('touchstart', (e) => {
            if (!e.target.closest('#ui-container') && !e.target.closest('#toggle-btn')) {
                uiContainer.classList.add('hidden');
            }
        });
    </script>
