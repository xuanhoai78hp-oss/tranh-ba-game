<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tu Tiên Săn Côn Trùng</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1810;font-family:system-ui,sans-serif;user-select:none;touch-action:none}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated}

#hud{position:fixed;top:0;left:0;right:0;padding:8px 12px;display:flex;gap:10px;align-items:center;color:#e8f0d0;font-size:13px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);z-index:10}
.stat{display:flex;align-items:center;gap:4px;text-shadow:0 1px 2px #000}
.stat b{color:#ffe060;font-weight:700}
#hpWrap{flex:1;min-width:80px;max-width:160px;height:14px;background:#301010;border:1px solid #602020;border-radius:3px;overflow:hidden;position:relative}
#hpBar{height:100%;background:linear-gradient(to bottom,#e04040,#a02020);width:100%;transition:width .1s}
#hpTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;font-weight:700}

/* Nút Bảng Thuộc Tính */
#statsToggleBtn{padding:6px 10px;background:#2a4010;border:1px solid #8b9a40;color:#ffe060;border-radius:6px;font-weight:700;cursor:pointer;margin-left:auto}

/* Bảng Thuộc Tính Popup */
#statsModal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:280px;background:rgba(15,25,12,.95);border:2px solid #8b9a40;border-radius:10px;padding:16px;color:#e8f0d0;z-index:50;box-shadow:0 10px 25px rgba(0,0,0,.8);display:none}
#statsModal.active{display:block}
#statsModal h2{font-size:18px;color:#ffe060;text-align:center;margin-bottom:12px;border-bottom:1px solid #4a6a2a;padding-bottom:6px}
.row{display:flex;justify-content:space-between;margin:8px 0;font-size:13px}
.row span{color:#a0c090}
.row b{color:#fff}
#closeStatsBtn{width:100%;padding:8px;margin-top:12px;background:#4a6a2a;border:none;color:#fff;font-weight:700;border-radius:4px;cursor:pointer}

#actions{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:10}
.btn{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#4a6a2a,#2a4010);border:2px solid #8b9a40;color:#e8f0d0;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 0 #1a2008;touch-action:manipulation}
.btn:active{transform:translateY(2px)}

#dpad{position:fixed;bottom:20px;left:20px;width:170px;height:170px;z-index:10}
.dp{position:absolute;width:52px;height:52px;background:radial-gradient(circle at 30% 30%,#4a6a2a,#2a4010);border:2px solid #8b9a40;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#e8f0d0;font-size:20px;font-weight:700;touch-action:manipulation}
#dpU{top:0;left:59px} #dpD{bottom:0;left:59px} #dpL{top:59px;left:0} #dpR{top:59px;right:0}

#overlay{position:fixed;inset:0;background:rgba(8,12,6,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:100;color:#e8f0d0;text-align:center;padding:20px}
#overlay h1{font-size:26px;color:#ffe060}
#overlay button{padding:12px 28px;font-size:16px;font-weight:700;background:#4a6a2a;color:#ffe060;border:2px solid #8b9a40;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- HUD Trên cùng -->
<div id="hud">
  <div style="display:flex;align-items:center;gap:4px">
    <span>❤️</span>
    <div id="hpWrap"><div id="hpBar"></div><div id="hpTxt">100/100</div></div>
  </div>
  <div class="stat">💠 <b id="coreTxt">0</b></div>
  <div class="stat">🪙 <b id="coinTxt">0</b></div>
  <button id="statsToggleBtn">📊 Thuộc tính</button>
</div>

<!-- Bảng Thuộc Tính Popup -->
<div id="statsModal">
  <h2>📜 BẢNG THUỘC TÍNH</h2>
  <div class="row"><span>Cảnh Giới:</span> <b id="stRealm">Luyện Khí T3</b></div>
  <div class="row"><span>Sinh Lực (HP):</span> <b id="stHp">100 / 100</b></div>
  <div class="row"><span>Sức Tấn Công:</span> <b id="stAtk">35</b></div>
  <div class="row"><span>Tốc Độ Di Chuyển:</span> <b id="stSpd">180</b></div>
  <div class="row"><span>Linh Thạch:</span> <b id="stCore">0</b></div>
  <div class="row"><span>Đồng Tiền:</span> <b id="stCoin">0</b></div>
  <div class="row"><span>Quái Đã Hạ:</span> <b id="stKills">0</b></div>
  <button id="closeStatsBtn">Đóng Bảng</button>
</div>

<!-- Điều khiển -->
<div id="dpad">
  <div class="dp" id="dpU">▲</div>
  <div class="dp" id="dpL">◄</div>
  <div class="dp" id="dpR">►</div>
  <div class="dp" id="dpD">▼</div>
</div>

<div id="actions">
  <div class="btn" id="throwBtn">🪨</div>
</div>

<!-- Màn hình bắt đầu -->
<div id="overlay">
  <h1>⚔ Tu Tiên Săn Côn Trùng</h1>
  <p>Tự động nhặt đồ rơi ra từ quái vật!<br>Nhấn nút bên dưới để bắt đầu.</p>
  <button id="startBtn">Tiến Vào</button>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;

function resize() {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
}
window.addEventListener('resize', resize); resize();

const p = { x: 0, y: 0, hp: 100, maxHp: 100, spd: 180, atk: 35, facing: 1, cd: 0, kills: 0 };
const game = { core: 0, coin: 0, state: 'start' };
const camera = { x: 0, y: 0 };
const bushes = [], insects = [], stones = [], drops = [];
const keys = {};

document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function initWorld() {
  p.x = 0; p.y = 0; p.hp = 100; p.kills = 0; game.core = 0; game.coin = 0;
  bushes.length = 0; insects.length = 0; stones.length = 0; drops.length = 0;

  for (let i = 0; i < 50; i++) {
    const a = Math.random() * Math.PI * 2, d = 150 + Math.random() * 1500;
    bushes.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, r: 12 + Math.random() * 8 });
  }
  for (let i = 0; i < 18; i++) spawnInsect();
  updateUI();
}

function spawnInsect() {
  const a = Math.random() * Math.PI * 2, d = 300 + Math.random() * 1200;
  insects.push({
    x: Math.cos(a) * d, y: Math.sin(a) * d,
    hp: 80, maxHp: 80, type: Math.random() < 0.5 ? 'spider' : 'mantis'
  });
}

function updateUI() {
  document.getElementById('hpBar').style.width = (p.hp / p.maxHp * 100) + '%';
  document.getElementById('hpTxt').innerText = `${Math.max(0, Math.round(p.hp))}/${p.maxHp}`;
  document.getElementById('coreTxt').innerText = game.core;
  document.getElementById('coinTxt').innerText = game.coin;
}

function updateStatsModal() {
  document.getElementById('stHp').innerText = `${Math.max(0, Math.round(p.hp))} / ${p.maxHp}`;
  document.getElementById('stAtk').innerText = p.atk;
  document.getElementById('stSpd').innerText = p.spd;
  document.getElementById('stCore').innerText = game.core;
  document.getElementById('stCoin').innerText = game.coin;
  document.getElementById('stKills').innerText = p.kills;
}

function update(dt) {
  if (game.state !== 'playing') return;

  // Di chuyển
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'] || keys['dp_u']) dy -= 1;
  if (keys['s'] || keys['arrowdown'] || keys['dp_d']) dy += 1;
  if (keys['a'] || keys['arrowleft'] || keys['dp_l']) dx -= 1;
  if (keys['d'] || keys['arrowright'] || keys['dp_r']) dx += 1;

  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    p.x += (dx / len) * p.spd * dt;
    p.y += (dy / len) * p.spd * dt;
    if (dx) p.facing = dx > 0 ? 1 : -1;
  }

  if (p.cd > 0) p.cd -= dt;

  // Đá tấn công
  for (let i = stones.length - 1; i >= 0; i--) {
    const s = stones[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) { stones.splice(i, 1); continue; }

    for (const ins of insects) {
      if (ins.hp > 0 && Math.hypot(s.x - ins.x, s.y - ins.y) < 22) {
        ins.hp -= p.atk;
        stones.splice(i, 1);
        if (ins.hp <= 0) {
          p.kills++;
          // Rớt đồ
          const dropType = Math.random() < 0.4 ? 'coin' : (Math.random() < 0.7 ? 'core' : 'herb');
          drops.push({ x: ins.x, y: ins.y, type: dropType });
          setTimeout(spawnInsect, 3000);
        }
        break;
      }
    }
  }

  // Quái đuổi theo
  for (const ins of insects) {
    if (ins.hp <= 0) continue;
    const dist = Math.hypot(p.x - ins.x, p.y - ins.y);
    if (dist < 280 && dist > 15) {
      ins.x += ((p.x - ins.x) / dist) * 60 * dt;
      ins.y += ((p.y - ins.y) / dist) * 60 * dt;
    }
  }

  // Tự động nhặt đồ rơi
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    if (Math.hypot(p.x - d.x, p.y - d.y) < 25) {
      if (d.type === 'coin') game.coin += 10;
      else if (d.type === 'core') game.core += 1;
      else if (d.type === 'herb') p.hp = Math.min(p.maxHp, p.hp + 20);
      drops.splice(i, 1);
      updateUI();
    }
  }

  // Camera
  camera.x += (p.x - W / 2 - camera.x) * 0.1;
  camera.y += (p.y - H / 2 - camera.y) * 0.1;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0f2415'; ctx.fillRect(0, 0, W, H);

  const cx = camera.x, cy = camera.y;

  if (game.state === 'playing') {
    // Bụi cây
    ctx.fillStyle = '#1e3a18';
    for (const b of bushes) {
      ctx.beginPath(); ctx.arc(b.x - cx, b.y - cy, b.r, 0, Math.PI * 2); ctx.fill();
    }

    // Đồ rớt trên mặt đất
    for (const d of drops) {
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      const icon = d.type === 'coin' ? '🪙' : (d.type === 'core' ? '💠' : '🌿');
      ctx.fillText(icon, d.x - cx, d.y - cy + 5);
    }

    // Quái vật
    for (const ins of insects) {
      if (ins.hp <= 0) continue;
      ctx.fillStyle = ins.type === 'spider' ? '#a040e0' : '#40e060';
      ctx.beginPath(); ctx.arc(ins.x - cx, ins.y - cy, 14, 0, Math.PI * 2); ctx.fill();
      // Thanh máu quái
      ctx.fillStyle = '#f00'; ctx.fillRect(ins.x - cx - 12, ins.y - cy - 20, 24, 3);
      ctx.fillStyle = '#0f0'; ctx.fillRect(ins.x - cx - 12, ins.y - cy - 20, (ins.hp / ins.maxHp) * 24, 3);
    }

    // Nhân vật
    ctx.fillStyle = '#ffe060';
    ctx.beginPath(); ctx.arc(p.x - cx, p.y - cy, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(p.x - cx + (p.facing * 4), p.y - cy - 2, 3, 0, Math.PI * 2); ctx.fill();

    // Đá ném
    ctx.fillStyle = '#ddd';
    for (const s of stones) {
      ctx.beginPath(); ctx.arc(s.x - cx, s.y - cy, 5, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function throwStone() {
  if (p.cd > 0) return;
  p.cd = 0.3;
  stones.push({ x: p.x, y: p.y, vx: p.facing * 500, vy: 0, life: 1.0 });
}

function loop() {
  update(0.016);
  draw();
  requestAnimationFrame(loop);
}

// Bảng thuộc tính modal
const modal = document.getElementById('statsModal');
document.getElementById('statsToggleBtn').onclick = () => {
  updateStatsModal();
  modal.classList.toggle('active');
};
document.getElementById('closeStatsBtn').onclick = () => modal.classList.remove('active');

// Nút bắt đầu & ném đá
document.getElementById('startBtn').onclick = () => {
  document.getElementById('overlay').style.display = 'none';
  initWorld();
  game.state = 'playing';
};
document.getElementById('throwBtn').onclick = throwStone;

function bindD(id, k) {
  const e = document.getElementById(id);
  e.onmousedown = e.ontouchstart = (ev) => { ev.preventDefault(); keys[k] = true; };
  e.onmouseup = e.ontouchend = (ev) => { ev.preventDefault(); keys[k] = false; };
}
bindD('dpU', 'dp_u'); bindD('dpD', 'dp_d'); bindD('dpL', 'dp_l'); bindD('dpR', 'dp_r');

requestAnimationFrame(loop);
</script>
</body>
</html>
