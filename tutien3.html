<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hành Trình Linh Chi</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #183923; color: white;
    font-family: system-ui, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #hud {
    position: fixed; z-index: 2; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; gap: 8px;
    pointer-events: none; font-size: 13px; text-shadow: 0 1px 3px #000;
  }
  .panel {
    padding: 7px 10px; border-radius: 12px;
    background: #10251dcc; line-height: 1.55;
  }
  #healthBar {
    width: 115px; height: 9px; margin-top: 3px;
    border: 1px solid #fff9; border-radius: 8px; overflow: hidden;
  }
  #healthFill { height: 100%; width: 100%; background: #50df6d;
    transition: width .15s linear, background .2s linear; }
  #exploreBtn {
    margin-top: 6px;
    pointer-events: auto;
    display: inline-block;
    border: 1px solid #ffffff55;
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 700;
    color: #eaffdf;
    background: #1c6e46cc;
    box-shadow: 0 2px 8px #0006;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #exploreBtn:active { transform: translateY(1px); background: #145534cc; }
  #controls {
    position: fixed; z-index: 3; left: 0; right: 0; bottom: 0;
    height: 145px; display: flex; align-items: center;
    justify-content: space-between; padding: 12px 24px;
    pointer-events: none;
  }
  #stickArea, #throwBtn { pointer-events: auto; touch-action: none; }
  #stickArea {
    position: relative; width: 112px; height: 112px; border-radius: 50%;
    background: #ffffff20; border: 2px solid #ffffff70;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  #stick {
    position: absolute; width: 48px; height: 48px; left: 30px; top: 30px;
    border-radius: 50%; background: #eaffdfcc; border: 2px solid white;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
  }
  #throwBtn {
    position: relative;
    width: 82px; height: 82px; border: 2px solid white; border-radius: 50%;
    color: white; font-weight: 800; font-size: 16px;
    background: #b34832dd; box-shadow: 0 3px 12px #0008;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: opacity .18s ease, background .18s ease;
  }
  #throwBtn.out-of-range {
    opacity: .35;
    background: #555a5faa;
    border-color: #ffffff55;
  }
  #throwBtn.out-of-range::after {
    content: "ngoài tầm";
    position: absolute;
    left: 50%; bottom: -22px;
    transform: translateX(-50%);
    font-size: 10px; font-weight: 600;
    color: #ffffffcc;
    text-shadow: 0 1px 3px #000;
    white-space: nowrap;
  }
  #message {
    position: fixed; z-index: 4; inset: 0; display: none;
    align-items: center; justify-content: center; text-align: center;
    background: #0009; padding: 24px;
  }
  #message > div {
    padding: 22px; border-radius: 16px; background: #173a25;
    max-width: 320px;
  }
  #restart {
    margin-top: 12px; border: 0; border-radius: 10px;
    padding: 10px 18px; font-size: 16px; font-weight: bold;
    color: white; background: #2c8b57;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #hint {
    position: fixed; z-index: 2; top: 82px; left: 50%;
    transform: translateX(-50%); font-size: 12px; color: #fff;
    text-shadow: 0 1px 4px black; text-align: center; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">
    <div>❤️ <span id="hpText">100</span>%</div>
    <div id="healthBar"><div id="healthFill"></div></div>
    <button id="exploreBtn" type="button">🧭 Khám phá</button>
  </div>
  <div class="panel" style="text-align:right">
    <div>⭐ Cấp <span id="levelText">1</span></div>
    <div>💎 <span id="stoneText">0</span>/5　🍄 <span id="mushText">0</span>/5</div>
    <div>📍 <span id="distanceText">0</span> m　🎯 <span id="rangeText">5</span> m</div>
  </div>
</div>

<div id="hint">Di chuyển bằng joystick · Ném linh thạch khi côn trùng trong tầm</div>

<div id="controls">
  <div id="stickArea"><div id="stick"></div></div>
  <button id="throwBtn">NÉM</button>
</div>

<div id="message">
  <div>
    <h2>Cuộc phiêu lưu kết thúc</h2>
    <p id="endText"></p>
    <button id="restart">Chơi lại</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const sprite = new Image();
  sprite.src = "anh.png";

  const hpText = document.getElementById("hpText");
  const healthFill = document.getElementById("healthFill");
  const levelText = document.getElementById("levelText");
  const stoneText = document.getElementById("stoneText");
  const mushText = document.getElementById("mushText");
  const distanceText = document.getElementById("distanceText");
  const rangeText = document.getElementById("rangeText");
  const throwBtn = document.getElementById("throwBtn");
  const message = document.getElementById("message");
  const endText = document.getElementById("endText");

  let W = innerWidth, H = innerHeight, dpr = 1, ppm = 1;
  let lastTime = 0, gameOver = false, audioCtx = null;
  let entities = [], scenery = [], bullets = [];
  let joy = { x: 0, y: 0 };
  let attackHeld = false;

  const block = e => e.preventDefault();
  document.addEventListener("contextmenu", block);
  document.addEventListener("selectstart", e => {
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    e.preventDefault();
  });
  document.addEventListener("dragstart", block);

  const player = {};

  // ===== Cấu hình =====
  const CONFIG = {
    MAP_LENGTH: 200,              // Chu vi vòng lặp (mét)
    THROW_RANGE_BASE: 5,
    THROW_RANGE_PER_LEVEL: 1,
    TANK_DETECT_RANGE: 8,
    TANK_WARN_TIME: 0.9,
    TANK_BULLET_SPEED: 14,
    TANK_DAMAGE: 12,
    BUG_DAMAGE: 3,
    BUG_MAX_HP: 3,
    BUG_SPEED: 1.3,
    MAIN_GAP_MIN: 22,
    MAIN_GAP_MAX: 28,
    PICKUP_GAP: 7,
    VIEW_BACK: 12,
    VIEW_FWD: 30
  };

  // ===== Hàm vòng lặp bản đồ =====
  function wrapDelta(objY, refY) {
    let d = objY - refY;
    const L = CONFIG.MAP_LENGTH;
    d = ((d % L) + L) % L;
    if (d > L / 2) d -= L;
    return d;
  }

  function circularDistanceTo(objX, objY) {
    const dy = wrapDelta(objY, player.y);
    const dx = objX - player.x;
    return Math.hypot(dx, dy);
  }

  function bugsPerClusterForLevel(level) {
    if (level < 5) return 1;
    return 1 + 2 * Math.floor((level - 5) / 5);
  }

  function throwRange() {
    return CONFIG.THROW_RANGE_BASE +
           (player.level - 1) * CONFIG.THROW_RANGE_PER_LEVEL;
  }

  function resetGame() {
    Object.assign(player, {
      x: 10, y: 3, hp: 100, level: 1,
      stones: 0, mushrooms: 0, facingX: 1, facingY: 1,
      anim: 0, attackingUntil: 0, cooldownUntil: 0,
      invulnerableUntil: 0, loops: 0
    });
    gameOver = false;
    message.style.display = "none";
    buildWorld();
    updateHud();
    updateThrowButtonState();
  }

  function resize() {
    W = innerWidth;
    H = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ppm = W / 20;
  }
  addEventListener("resize", resize);
  resize();

  function rand(min, max) { return min + Math.random() * (max - min); }

  // ===== Sinh thế giới (bản gốc của 1 vòng) =====
  // Ta lưu "template" gồm vị trí y cố định cho từng mốc, và mỗi lần
  // respawnWorld() chỉ cần đổi x + reset trạng thái alive/hp/aggro.
  let anchors = [];   // danh sách các mốc gốc của 1 vòng

  function buildWorld() {
    entities = [];
    scenery = [];
    bullets = [];
    anchors = [];
    const L = CONFIG.MAP_LENGTH;

    // Cỏ trang trí
    for (let i = 0; i < Math.round(L * 0.7); i++) {
      scenery.push({
        x: rand(0.3, 19.7), y: rand(0, L),
        size: rand(0.08, 0.23), phase: rand(0, 6.28)
      });
    }

    // Mốc gốc: vị trí y cố định, x random. Các lần respawn sau
    // chỉ đổi x, giữ y để player không bị "map nhảy sau lưng".
    let cursor = 4;
    while (cursor < L - 4) {
      anchors.push({ kind: "tank", y: cursor % L });
      anchors.push({ kind: "cluster", y: (cursor + CONFIG.PICKUP_GAP) % L });
      cursor += rand(CONFIG.MAIN_GAP_MIN, CONFIG.MAIN_GAP_MAX);
    }

    // Vật phẩm rải rác
    for (let i = 0; i < Math.round(L / 20); i++) {
      anchors.push({
        kind: Math.random() < 0.6 ? "looseMushroom" : "looseStone",
        y: rand(0, L)
      });
    }

    spawnFromAnchors();
  }

  // Sinh lại toàn bộ entities từ anchors với vị trí x ngẫu nhiên mới
  function spawnFromAnchors() {
    entities = entities.filter(e => e.type === "tank" || e.type === "bug1" ||
                                     e.type === "bug2" || e.type === "mushroom");
    // Đơn giản hơn: tạo mới toàn bộ
    entities = [];
    const clusterCount = bugsPerClusterForLevel(player.level);

    for (const a of anchors) {
      if (a.kind === "tank") {
        entities.push({
          type: "tank", x: rand(4, 16), y: a.y,
          dir: Math.random() < 0.5 ? 1 : -1,
          anim: 0, lastHit: 0, alive: true,
          lastTread: 0, rand: Math.random(),
          aimTarget: null, aimAt: 0, warnAt: 0, cooldownUntil: 0
        });
      } else if (a.kind === "cluster") {
        const clusterX = rand(3, 17);
        const clusterId = a.y; // dùng y làm id để khớp côn trùng với nấm
        entities.push({
          type: "mushroom", x: clusterX, y: a.y,
          alive: true, clusterId
        });
        for (let b = 0; b < clusterCount; b++) {
          const ang = (b / clusterCount) * Math.PI * 2 + rand(-0.3, 0.3);
          const r = rand(0.5, 1.2);
          entities.push({
            type: Math.random() < 0.5 ? "bug1" : "bug2",
            x: Math.max(1, Math.min(19, clusterX + Math.cos(ang) * r)),
            y: a.y + Math.sin(ang) * r,
            dirX: 1, dirY: 1, anim: 0,
            aggro: false,
            attackAt: 0, alive: true,
            hp: CONFIG.BUG_MAX_HP,
            hurtFlashUntil: 0,
            guardX: clusterX,
            guardY: a.y,
            clusterId,
            wanderPhase: rand(0, 6.28)
          });
        }
      } else if (a.kind === "looseMushroom") {
        entities.push({
          type: "mushroom", x: rand(2, 18), y: a.y,
          alive: true, clusterId: -1
        });
      } else if (a.kind === "looseStone") {
        entities.push({
          type: "stone", x: rand(2, 18), y: a.y, alive: true
        });
      }
    }
  }

  // ============================================================
  //                      AUDIO ENGINE
  // ============================================================
  const SFX_FILES = {
    tank: "", squash: "", rustle: "", gem: "", lock: "", fire: ""
  };
  const sfxCache = {};
  function tryLoadFile(key) {
    if (!SFX_FILES[key]) return null;
    if (sfxCache[key]) return sfxCache[key];
    try {
      const a = new Audio(SFX_FILES[key]);
      a.preload = "auto";
      a.volume = 0.6;
      sfxCache[key] = a;
      return a;
    } catch (_) { return null; }
  }
  function playFile(key) {
    const a = tryLoadFile(key);
    if (!a) return false;
    try {
      const clone = a.cloneNode();
      clone.volume = a.volume;
      clone.play().catch(() => {});
      return true;
    } catch (_) { return false; }
  }

  function activateAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  let noiseBuffer = null;
  function getNoise() {
    if (!audioCtx) return null;
    if (noiseBuffer) return noiseBuffer;
    const len = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    noiseBuffer = buf;
    return buf;
  }

  function beep(freq, duration = 0.09, type = "sine", vol = 0.08) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }

  function slideSound(from, to, duration, type = "sawtooth", vol = 0.15) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(from, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + duration);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }

  function mechanicalRumble(duration = 0.35, freq = 90, vol = 0.06, bandQ = 6) {
    if (!audioCtx) return;
    const buf = getNoise();
    if (!buf) return;
    const t = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = freq;
    bp.Q.value = bandQ;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.03);
    gain.gain.setValueAtTime(vol, t + duration - 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.type = "square";
    lfo.frequency.value = 22 + Math.random() * 8;
    lfoGain.gain.value = vol * 0.9;
    lfo.connect(lfoGain).connect(gain.gain);
    lfo.start(t);
    lfo.stop(t + duration);
    src.connect(bp).connect(gain).connect(audioCtx.destination);
    src.start(t);
    src.stop(t + duration + 0.02);
  }

  function squashSound() {
    if (playFile("squash")) return;
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    slideSound(220, 60, 0.18, "square", 0.14);
    const buf = getNoise();
    if (buf) {
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(1800, t);
      lp.frequency.exponentialRampToValueAtTime(300, t + 0.18);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      src.connect(lp).connect(g).connect(audioCtx.destination);
      src.start(t);
      src.stop(t + 0.22);
    }
  }

  function rustleSound() {
    if (playFile("rustle")) return;
    if (!audioCtx) return;
    const buf = getNoise();
    if (!buf) return;
    const t0 = audioCtx.currentTime;
    for (let i = 0; i < 3; i++) {
      const t = t0 + i * 0.07;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const hp = audioCtx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 1200 + i * 400;
      const g = audioCtx.createGain();
      const v = 0.10 - i * 0.02;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(v, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      src.connect(hp).connect(g).connect(audioCtx.destination);
      src.start(t);
      src.stop(t + 0.12);
    }
    beep(880, 0.05, "triangle", 0.06);
  }

  function gemPickSound() {
    if (playFile("gem")) return;
    beep(900, 0.06, "triangle", 0.09);
    setTimeout(() => beep(1350, 0.08, "triangle", 0.09), 40);
  }

  function tankLockSound() {
    if (playFile("lock")) return;
    beep(1400, 0.05, "square", 0.06);
    setTimeout(() => beep(1700, 0.05, "square", 0.06), 90);
  }

  function tankFireSound() {
    if (playFile("fire")) return;
    slideSound(240, 60, 0.22, "sawtooth", 0.18);
    mechanicalRumble(0.15, 140, 0.10, 4);
  }

  function loopChime() {
    beep(660, 0.12, "triangle", 0.10);
    setTimeout(() => beep(880, 0.12, "triangle", 0.10), 110);
    setTimeout(() => beep(1320, 0.18, "triangle", 0.10), 220);
  }

  let stepTimer = 0;
  function footstepStep(dt, moving) {
    if (!audioCtx) return;
    if (!moving) { stepTimer = 0; return; }
    stepTimer -= dt;
    if (stepTimer <= 0) {
      stepTimer = 0.34;
      const buf = getNoise();
      if (!buf) return;
      const t = audioCtx.currentTime;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 700 + Math.random() * 300;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.05, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      src.connect(lp).connect(g).connect(audioCtx.destination);
      src.start(t);
      src.stop(t + 0.11);
    }
  }

  // ============================================================
  //                      HUD
  // ============================================================
  function updateHud() {
    hpText.textContent = Math.ceil(player.hp);
    healthFill.style.width = Math.max(0, player.hp) + "%";
    healthFill.style.background =
      player.hp > 50 ? "#50df6d" : player.hp > 25 ? "#ffd34a" : "#ff4c4c";
    levelText.textContent = player.level;
    stoneText.textContent = player.stones;
    mushText.textContent = player.mushrooms;
    distanceText.textContent = Math.floor(player.y) + ` (vòng ${player.loops})`;
    rangeText.textContent = throwRange();
  }

  function updateThrowButtonState() {
    if (gameOver) {
      throwBtn.classList.add("out-of-range");
      return;
    }
    const inRange = !!nearestBugInRange();
    if (inRange) throwBtn.classList.remove("out-of-range");
    else throwBtn.classList.add("out-of-range");
  }

  function levelUp() {
    player.level++;
    beep(660, 0.10, "triangle", 0.10);
    setTimeout(() => beep(880, 0.12, "triangle", 0.10), 90);
    setTimeout(() => beep(1320, 0.16, "triangle", 0.10), 190);
    updateHud();
  }

  function damage(amount, source) {
    const now = performance.now() / 1000;
    if (now < player.invulnerableUntil || gameOver) return;
    player.hp = Math.max(0, player.hp - amount);
    player.invulnerableUntil = now + 3;

    if (source === "tank") {
      slideSound(180, 40, 0.35, "sawtooth", 0.18);
      mechanicalRumble(0.25, 70, 0.08, 4);
    } else {
      slideSound(300, 120, 0.15, "square", 0.12);
    }

    if (player.hp <= 0) {
      gameOver = true;
      endText.textContent = `Bạn đã đi được ${Math.floor(player.y)} m (vòng ${player.loops}) và đạt cấp ${player.level}.`;
      message.style.display = "flex";
      slideSound(220, 60, 0.9, "sawtooth", 0.15);
      throwBtn.classList.add("out-of-range");
    }
    updateHud();
  }

  function nearestBugInRange() {
    const range = throwRange();
    let target = null, best = Infinity;
    for (const e of entities) {
      if (!e.alive) continue;
      if (e.type !== "bug1" && e.type !== "bug2") continue;
      const d = circularDistanceTo(e.x, e.y);
      if (d <= range && d < best) { target = e; best = d; }
    }
    return target;
  }

  function throwStone() {
    activateAudio();
    if (gameOver) return;
    const now = performance.now() / 1000;
    if (now < player.cooldownUntil) return;

    const target = nearestBugInRange();
    if (!target) {
      player.cooldownUntil = now + 0.25;
      return;
    }

    player.cooldownUntil = now + 0.7;
    player.attackingUntil = now + 0.36;
    const dxv = target.x - player.x;
    const dyv = wrapDelta(target.y, player.y);
    player.facingX = dxv || player.facingX;
    player.facingY = dyv || player.facingY;

    target.hp -= 1;
    target.aggro = true;
    target.hurtFlashUntil = now + 0.25;

    mechanicalRumble(0.10, 2200, 0.05, 2);
    if (target.hp <= 0) {
      target.alive = false;
      entities.push({
        type: "stone",
        x: target.x, y: target.y, alive: true
      });
      setTimeout(squashSound, 60);
    } else {
      setTimeout(() => slideSound(600, 300, 0.1, "triangle", 0.08), 50);
    }
  }

  function collect(e) {
    if (!e.alive) return;
    e.alive = false;
    if (e.type === "mushroom") {
      const wasFull = player.hp >= 99.99;
      player.hp = Math.min(100, player.hp + 5);
      rustleSound();
      if (wasFull) {
        player.mushrooms++;
        if (player.mushrooms >= 5) {
          player.mushrooms = 0;
          levelUp();
        }
      }
      // Nấm bị hái → côn trùng cùng cụm aggro
      if (e.clusterId !== undefined && e.clusterId !== -1) {
        for (const b of entities) {
          if (!b.alive) continue;
          if ((b.type === "bug1" || b.type === "bug2") &&
              b.clusterId === e.clusterId) {
            b.aggro = true;
          }
        }
      }
    } else if (e.type === "stone") {
      player.stones++;
      gemPickSound();
      if (player.stones >= 5) {
        player.stones = 0;
        levelUp();
      }
    }
    updateHud();
  }

  // ============================================================
  //         RESPAWN khi đi hết 1 vòng
  // ============================================================
  // Khác biệt với resetGame: giữ nguyên level, HP, stones/mushrooms
  // đang đếm; chỉ làm tươi lại (respawn) mọi vật thể.
  function respawnWorld() {
    // Xoá đạn đang bay cho an toàn
    bullets = [];
    // Sinh lại từ anchors — vị trí y giữ nguyên, x random mới
    spawnFromAnchors();
    loopChime();
    // Cập nhật trạng thái nút NÉM ngay
    updateThrowButtonState();
  }

  // ============================================================
  //                      UPDATE
  // ============================================================
  function update(dt, now) {
    if (gameOver) return;

    const speed = 4.2;
    const prevY = player.y;
    player.x += joy.x * speed * dt;
    player.y += -joy.y * speed * dt;
    player.x = Math.max(0.7, Math.min(19.3, player.x));

    const L = CONFIG.MAP_LENGTH;
    let looped = false;
    while (player.y < 0) { player.y += L; player.loops--; looped = true; }
    while (player.y >= L) { player.y -= L; player.loops++; looped = true; }

    // Đi hết 1 vòng → respawn vật thể (vị trí y giữ, x + trạng thái làm mới)
    if (looped) respawnWorld();

    const moving = Math.hypot(joy.x, joy.y) > 0.12;
    if (moving) {
      player.facingX = joy.x;
      player.facingY = -joy.y;
      player.anim += dt * 9;
    }
    footstepStep(dt, moving);

    const seconds = now / 1000;
    if (attackHeld) throwStone();

    // Đạn
    for (const b of bullets) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
    }
    for (const b of bullets) {
      if (b.dead) continue;
      const d = Math.hypot(b.x - player.x, wrapDelta(b.y, player.y));
      if (d < 0.9) {
        b.dead = true;
        damage(CONFIG.TANK_DAMAGE, "tank");
      }
    }
    bullets = bullets.filter(b => !b.dead && b.life > 0);

    // Entities
    for (const e of entities) {
      if (!e.alive) continue;

      const circDy = wrapDelta(e.y, player.y);
      if (circDy < -CONFIG.VIEW_BACK || circDy > CONFIG.VIEW_FWD) continue;

      if (e.type === "tank") {
        e.x += e.dir * 2.5 * dt;
        e.anim += dt * 8;
        if (e.x > 18.1) { e.x = 18.1; e.dir = -1; }
        if (e.x < 1.9) { e.x = 1.9; e.dir = 1; }

        const distToTank = circularDistanceTo(e.x, e.y);
        if (distToTank < 12) {
          e.lastTread = (e.lastTread || 0) - dt;
          if (e.lastTread <= 0) {
            e.lastTread = 0.38 + Math.random() * 0.12;
            const vol = Math.max(0.015, 0.07 * (1 - distToTank / 12));
            mechanicalRumble(0.32, 78 + e.rand * 20, vol, 6);
          }
        }

        if (seconds < e.cooldownUntil) {
          e.aimTarget = null;
          e.warnAt = 0;
        } else if (distToTank < CONFIG.TANK_DETECT_RANGE) {
          if (!e.aimTarget) {
            e.aimTarget = { x: player.x, y: player.y };
            e.warnAt = seconds + CONFIG.TANK_WARN_TIME;
            e.aimAt = seconds;
            tankLockSound();
          } else {
            e.aimTarget.x = player.x;
            e.aimTarget.y = player.y;
            if (seconds >= e.warnAt) {
              const nx = e.x + (e.dir > 0 ? 1.4 : -1.4);
              const ny = e.y;
              const dxv = player.x - nx;
              const dyv = wrapDelta(player.y, ny);
              const len = Math.hypot(dxv, dyv) || 1;
              const sb = CONFIG.TANK_BULLET_SPEED;
              bullets.push({
                x: nx, y: ny,
                vx: (dxv / len) * sb,
                vy: (dyv / len) * sb,
                life: 1.6, dead: false
              });
              tankFireSound();
              e.cooldownUntil = seconds + 2.2 + Math.random() * 0.8;
              e.aimTarget = null;
              e.warnAt = 0;
            }
          }
        } else {
          e.aimTarget = null;
          e.warnAt = 0;
        }
        continue;
      }

      if (e.type === "bug1" || e.type === "bug2") {
        if (e.aggro) {
          const dx = player.x - e.x;
          const dy = wrapDelta(player.y, e.y);
          const d = Math.hypot(dx, dy);
          if (d > 1.6) {
            e.x += (dx / (d || 1)) * CONFIG.BUG_SPEED * dt;
            e.y += (dy / (d || 1)) * CONFIG.BUG_SPEED * dt;
            while (e.y < 0) e.y += L;
            while (e.y >= L) e.y -= L;
            e.x = Math.max(0.6, Math.min(19.4, e.x));
          } else if (seconds > e.attackAt) {
            e.attackAt = seconds + 1.0;
            damage(CONFIG.BUG_DAMAGE, "bug");
          }
        } else {
          // Loanh quanh vị trí canh
          e.wanderPhase += dt * 0.8;
          const t = seconds * 0.5 + e.wanderPhase;
          const wx = e.guardX + Math.cos(t) * 0.6;
          const wy = e.guardY + Math.sin(t * 0.7) * 0.6;
          e.x += (wx - e.x) * Math.min(1, dt * 1.5);
          // y loanh quanh guardY có wrap
          let dy2 = wrapDelta(wy, e.y);
          let ny = e.y + dy2 * Math.min(1, dt * 1.5);
          ny = ((ny % L) + L) % L;
          e.y = ny;
        }
        e.anim += dt * 7;
        continue;
      }

      if (e.type === "mushroom" || e.type === "stone") {
        if (circularDistanceTo(e.x, e.y) < 1.25) collect(e);
      }
    }

    updateHud();
    updateThrowButtonState();
  }

  // ============================================================
  //                      RENDER
  // ============================================================
  function spriteFrame(row, col, x, y, size, flip = false, rotation = 0) {
    if (sprite.complete && sprite.naturalWidth >= 320 && sprite.naturalHeight >= 200) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(flip ? -1 : 1, 1);
      ctx.drawImage(sprite, col * 40, row * 40, 40, 40,
        -size / 2, -size / 2, size, size);
      ctx.restore();
    } else {
      ctx.fillStyle = "#f4df9b";
      ctx.beginPath();
      ctx.arc(x, y, size * 0.28, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBackground() {
    ctx.fillStyle = "#315b35";
    ctx.fillRect(0, 0, W, H);

    for (const s of scenery) {
      const dy = wrapDelta(s.y, player.y);
      const sx = s.x * ppm;
      const sy = H / 2 - dy * ppm;
      if (sy < -20 || sy > H + 20) continue;
      ctx.fillStyle = "#7da34b";
      ctx.beginPath();
      ctx.ellipse(sx, sy, s.size * ppm, s.size * ppm * 0.55,
        s.phase, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#b0c96c88";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx, sy + 3);
      ctx.lineTo(sx - 2, sy - 4);
      ctx.moveTo(sx, sy + 3);
      ctx.lineTo(sx + 3, sy - 4);
      ctx.stroke();
    }

    ctx.fillStyle = "#183d29";
    ctx.fillRect(0, 0, ppm * 0.45, H);
    ctx.fillRect(W - ppm * 0.45, 0, ppm * 0.45, H);
  }

  function drawMushroom(sx, sy) {
    ctx.fillStyle = "#f4ead0";
    ctx.fillRect(sx - 3, sy - 2, 6, 11);
    ctx.fillStyle = "#db4436";
    ctx.beginPath();
    ctx.ellipse(sx, sy - 4, 10, 7, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff2ca";
    ctx.beginPath();
    ctx.arc(sx - 3, sy - 7, 1.5, 0, 7);
    ctx.arc(sx + 3, sy - 6, 1.3, 0, 7);
    ctx.fill();
  }

  function drawStone(sx, sy) {
    ctx.fillStyle = "#6eeaff";
    ctx.strokeStyle = "#ddffff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx, sy - 9); ctx.lineTo(sx + 7, sy);
    ctx.lineTo(sx, sy + 9); ctx.lineTo(sx - 7, sy); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  function drawBullet(b) {
    const dy = wrapDelta(b.y, player.y);
    const sx = b.x * ppm;
    const sy = H / 2 - dy * ppm;
    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.arc(sx, sy, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff4c0";
    ctx.beginPath();
    ctx.arc(sx, sy, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawEntity(e, now) {
    // QUAN TRỌNG: bỏ qua mọi thứ đã chết (đã nhặt / đã giết)
    if (!e.alive) return;

    const dy = wrapDelta(e.y, player.y);
    if (dy < -CONFIG.VIEW_BACK - 4 || dy > CONFIG.VIEW_FWD + 4) return;
    const sx = e.x * ppm;
    const sy = H / 2 - dy * ppm;

    if (e.type === "mushroom") return drawMushroom(sx, sy);
    if (e.type === "stone") return drawStone(sx, sy);

    if (e.type === "tank") {
      if (e.aimTarget) {
        const t = now / 1000;
        const pulse = 0.5 + 0.5 * Math.sin(t * 30);
        ctx.save();
        ctx.globalAlpha = 0.75 * pulse;
        ctx.fillStyle = "#ff2a2a";
        ctx.beginPath();
        ctx.arc(sx + (e.dir > 0 ? 18 : -18), sy, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      const col = Math.floor(e.anim) % 4;
      const rotation = e.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
      spriteFrame(3, col, sx, sy, 3.5 * ppm, false, rotation);
      return;
    }

    if (e.hurtFlashUntil && now / 1000 < e.hurtFlashUntil) {
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = "#ff5555";
      ctx.beginPath();
      ctx.arc(sx, sy, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const row = e.type === "bug1" ? 1 : 2;
    const dxp = player.x - e.x;
    const dyp = wrapDelta(player.y, e.y);
    const flip = dxp < 0;
    const attacking = e.aggro && Math.hypot(dxp, dyp) < 1.8;
    const col = attacking ? 4 + (Math.floor(e.anim) % 4) :
                             (Math.floor(e.anim) % 4);
    spriteFrame(row, col, sx, sy, 2.5 * ppm, flip);

    if (e.hp < CONFIG.BUG_MAX_HP) {
      const barW = 26, barH = 3;
      const bx = sx - barW / 2, by = sy - 26;
      ctx.fillStyle = "#00000088";
      ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);
      ctx.fillStyle = "#ff5b5b";
      ctx.fillRect(bx, by, barW * (e.hp / CONFIG.BUG_MAX_HP), barH);
    }
  }

  function drawPlayer(now) {
    const sx = player.x * ppm;
    const sy = H / 2;
    const seconds = now / 1000;
    const blinking = seconds < player.invulnerableUntil &&
                     Math.floor(seconds * 12) % 2 === 0;
    if (blinking) return;

    const attacking = seconds < player.attackingUntil;
    const north = player.facingY >= 0;
    const row = north ? 0 : 4;
    const flip = player.facingX < 0;
    const col = attacking
      ? 4 + (Math.floor(seconds * 14) % 4)
      : (Math.floor(player.anim) % 4);

    spriteFrame(row, col, sx, sy, 1.9 * ppm, flip);
  }

  function render(now) {
    drawBackground();

    const visible = entities.slice().sort((a, b) => {
      const da = Math.abs(wrapDelta(a.y, player.y));
      const db = Math.abs(wrapDelta(b.y, player.y));
      return db - da;
    });
    for (const e of visible) drawEntity(e, now);
    drawPlayer(now);

    for (const b of bullets) drawBullet(b);

    if (!sprite.complete || sprite.naturalWidth === 0) {
      ctx.fillStyle = "white";
      ctx.font = "14px system-ui";
      ctx.fillText("Không tìm thấy anh.png — hãy đặt ảnh cùng thư mục với index.html", 12, H - 160);
    }
  }

  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000 || 0, 0.04);
    lastTime = now;
    update(dt, now);
    render(now);
    requestAnimationFrame(loop);
  }

  // ============================================================
  //                    INPUT
  // ============================================================
  const stickArea = document.getElementById("stickArea");
  const stick = document.getElementById("stick");
  let stickPointer = null;

  function moveStick(ev) {
    const r = stickArea.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = ev.clientX - cx, dy = ev.clientY - cy;
    const max = 34, len = Math.hypot(dx, dy);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    joy.x = dx / max;
    joy.y = dy / max;
  }

  stickArea.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    activateAudio();
    stickPointer = ev.pointerId;
    try { stickArea.setPointerCapture(ev.pointerId); } catch (_) {}
    moveStick(ev);
  });
  stickArea.addEventListener("pointermove", ev => {
    if (ev.pointerId === stickPointer) moveStick(ev);
  });
  function releaseStick(ev) {
    if (ev.pointerId !== stickPointer) return;
    stickPointer = null;
    joy.x = joy.y = 0;
    stick.style.transform = "translate(0,0)";
  }
  stickArea.addEventListener("pointerup", releaseStick);
  stickArea.addEventListener("pointercancel", releaseStick);
  stickArea.addEventListener("pointerleave", releaseStick);

  throwBtn.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    attackHeld = true;
    throwStone();
  });
  for (const eventName of ["pointerup", "pointercancel", "pointerleave"]) {
    throwBtn.addEventListener(eventName, () => attackHeld = false);
  }

  addEventListener("keydown", ev => {
    if (ev.key === "ArrowUp" || ev.key === "w") joy.y = -1;
    if (ev.key === "ArrowDown" || ev.key === "s") joy.y = 1;
    if (ev.key === "ArrowLeft" || ev.key === "a") joy.x = -1;
    if (ev.key === "ArrowRight" || ev.key === "d") joy.x = 1;
    if (ev.code === "Space") { ev.preventDefault(); throwStone(); }
  });
  addEventListener("keyup", ev => {
    if (["ArrowUp","ArrowDown","w","s"].includes(ev.key)) joy.y = 0;
    if (["ArrowLeft","ArrowRight","a","d"].includes(ev.key)) joy.x = 0;
  });

  document.getElementById("restart").addEventListener("click", () => {
    activateAudio();
    resetGame();
  });

  document.getElementById("exploreBtn").addEventListener("click", () => {
    activateAudio();
    window.location.href = "tuongzalo.html";
  });

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
